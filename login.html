<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAGINA DE LOGIN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bodyL">
  <div class="wrapper">
    <form id="formulario" action="#">
      <h2 id="welcome" >Seja bem vindo ao iMenu!</h2>
        <div class="input-field">
        <input type="email" id="email" required>
        <label>Insira seu email</label>
      </div>
      <div class="input-field">
        <input type="password" id="senha" required>
        <label>Insira sua senha</label>
      </div>
      <div class="forget">
        <label for="remember">
        </label>
        <a id="aL" href="#">Esqueceu sua senha?</a>
      </div>
      <button type="button" id="submit" onclick="logar()">Fazer Login</button>
      <div class="register">
        <p id="pH">Não tem uma conta? <a href="cadastro.html">Registre-se aqui</a></p>
        <p id="login_ms"></p>
      </div>
    </form>
  </div>
  <script src="js/server_script.js"></script>
</body>
</html>
