  <title>iMenu</title>
  <link rel="stylesheet" href="teste.css"/>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <nav>
      <a href="index.html">
        <span class="menu-item"><i data-lucide="home"></i><span>Início</span></span>
      </a>
      <a href="pesquisa.html">
