<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iMenu</title>
  <link rel="stylesheet" href="teste.css"/>
</head>
<body>

  <!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <nav>
    <a href="index.html">
      <span class="menu-item"><i data-lucide="home"></i><span>Início</span></span>
    </a>
    <a href="pesquisa.html">
      <span class="menu-item"><i data-lucide="utensils"></i><span>Menus</span></span>
    </a>
    <a href="#" onclick="localizacao()" id="mapaSidebar">
      <span class="menu-item"><i data-lucide="map-pin"></i><span>Mapa</span></span>
    </a>
    <a href="publicar.html" id="publicarSidebar">
      <span class="menu-item"><i data-lucide="file-text"></i><span>Publicar</span></span>
    </a>
    <a href="#" onclick="goeditor()" id="editorSidebar">
      <span class="menu-item"><i data-lucide="paintbrush"></i><span>Editor</span></span>
    </a>
    <a href="perfil.html" id="perfilSidebar">
      <span class="menu-item"><i data-lucide="user"></i><span>Perfil</span></span>
    </a>
  </nav>

  <div class="auth-sidebar-buttons">
    <button id="button-enter" onclick="gologin()" class="login-button">Entrar</button>
    <button id="button-acount" onclick="goecadastro()" class="register-button">Cadastrar</button>
  </div>
</div>



  <!-- Botão toggle da sidebar -->
  <button id="toggleSidebar" class="toggle-btn">☰</button>

  <header>
    <div class="logo">iMenu</div>
    <header>
      <nav class="horizontal-nav">
        <a href="index.html" class="nav-button"><p>Início</p></a>
        <a href="pesquisa.html" class="nav-button"><p>Menus</p></a>
        <button id="mapaAba" onclick="localizacao()" class="nav-button"><p>Mapa</p></button>
        <a href="publicar.html" id="publicarAba" onclick="gopublicar()" class="nav-button"><p>Publicar</p></a>
        <button id="editorAba" onclick="goeditor()" class="nav-button"><p>Editor</p></button>
        <a href="perfil.html" class="nav-button" id="perfil_nav"><p>Perfil</p></a>
      </nav>      
    </header>
    <div class="auth-buttons">
      <a href="perfil.html" id="perfil-link">
        <img id="perfil" src="images/perfil.png">
        <p id="username"></p>
      </a>
      <button id="button-acount" onclick="goecadastro()" class="register-button">Cadastrar</button>
      <button id="button-enter" onclick="gologin()" class="login-button">Entrar</button>
    </div>
  </header>

  <section class="hero">
    <h1>Faça mercado no iMenu</h1>
    <div class="search-bar">
      <input type="text" placeholder="Em qual endereço você está?" />
      <button>Ver restaurantes próximos</button>
    </div>
  </section>

  <div class="categories">
    <div class="category">Frios</div>
    <div class="category">Laticínios</div>
    <div class="category">Bebidas</div>
    <div class="category">Massas frescas</div>
    <div class="category">Padaria</div>
    <div class="category">Carnes</div>
  </div>

  <div class="main-cards">
    <div class="card red">
      <img src="images/drink.png" alt="Restaurante" />
      <div class="card-content">
        <h3>Bares</h3>
        <button class="btn btn-card">Ver opções</button>
      </div>
    </div>
    <div class="card green">
      <img src="images/hambu.png" alt="Mercado" />
      <div class="card-content">
        <h3>Restaurantes</h3>
        <button class="btn btn-card">Ver opções</button>
      </div>
    </div>
  </div>

  <section class="section">
    <h2>Cardápios criados recentemente</h2>
    <div class="posts-container">
    <button class="arrow left" onclick="scrollPosts(-1)">&#10094;</button>

    <div id="posts-recentes"></div>

    <button class="arrow right" onclick="scrollPosts(1)">&#10095;</button>
</div>


    </div>
    <div id="posts-infos"></div>
  </section>

  <section class="section">
    <h2>Restaurantes Famosos</h2>
    <div class="carousel">
      <div class="carousel-item">
        <img src="images/bistro-delicias.jpeg" alt="Restaurante 1" class="restaurant-image">
        <p>Bistro Delicias</p>
      </div>
      <div class="carousel-item">
        <img src="images/borcelle-logo.jpeg" alt="Restaurante 2" class="restaurant-image">
        <p>Borcelle</p>
      </div>
      <div class="carousel-item">
        <img src="images/cantinho-gourmet.jpeg" alt="Restaurante 3" class="restaurant-image">
        <p>Cantinho Gourmet</p>
      </div>
    </div>
  </section>


  <div id="footer-container"></div>

  <!-- Seu script do servidor e principal -->
<script src="js/server_script.js"></script>
<script src="js/script.js"></script>

<!-- Carrega o Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Inicialização -->
<script>
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-container').innerHTML = data;
    });
  

    //PASSAR POSTS

    function scrollPosts(direction) {
    const container = document.getElementById('posts-recentes');
    const scrollAmount = container.clientWidth / 1.2; // Ajuste esse valor conforme necessário
    container.scrollBy({
        left: direction * scrollAmount,
        behavior: 'smooth'
    });
}

  document.addEventListener("DOMContentLoaded", function () {
    const sidebar = document.getElementById("sidebar");
    const toggleButton = document.getElementById("toggleSidebar");

    if (toggleButton) {
      toggleButton.addEventListener("click", function () {
        sidebar.classList.toggle("expanded");
      });
    }

    verificarToken();

    // Agora que o DOM está pronto e o Lucide foi carregado
    lucide.createIcons();
  });
</script>

</body>
</html>
