<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMenu</title>
    <link rel="stylesheet" href="teste.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="logo">iMenu</h1>
            <nav>
                <a href="index.html" class="nav-button">
                    <img src="images/home.png" alt="Início"> Início
                </a>
                
                <a href="pesquisa.html" class="nav-button">
                    <img src="images/card.png" alt="Meus Menus"> Menus
                </a>
                
                <button id="mapaAba" onclick="localizacao()" class="nav-button">
                    <img src="images/local.png" alt="Mapa"> Mapa
                </button>
                
                <button id="editorAba" onclick="goeditor()" class="nav-button">
                    <img src="images/editor.png" alt="Editor"> Editor
                </button>
                
                <a href="#" class="nav-button">
                    <img src="images/config.png" alt="Configurações"> Configurações
                </a>
            </nav>
            
        </aside>
        
        <!-- Main Content -->
        <main class="content">
            <header class="topbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar...">
                </div>
                <div class="auth-buttons">
                <a href="#" id="conta" class="logo-content flex">
                    <img id="perfil" src="images/perfil.png" onclick="goperfil()">
                    <p id="username" onclick="goperfil()"></p>
                </a>
                    <button onclick="goecadastro()" class="register-button">Cadastrar</button>
                    <button onclick="gologin()" class="login-button">Entrar</button>
                </div>
            </header>
            
            <!-- Promoção / Banner -->
            <section class="promo-banner">
                <img src="images/Bem-vindo ao iMenu - cliente.png" alt="Promoção Especial">
                <div class="mascote-container">
                    <img src="images/mascote.png" alt="Mascote" class="mascote">
                </div>
            </section>

            <!-- Cardápios -->
            <section class="dashboard">
                <h2>Escolha um Design de Cardápio</h2>
                <div class="cards">
                    <div class="card">
                        <img src="menu1.jpg" alt="Design 1">
                        <p>Design 1</p>
                    </div>
                    <div class="card">
                        <img src="menu2.jpg" alt="Design 2">
                        <p>Design 2</p>
                    </div>
                    <div class="card">
                        <img src="menu3.jpg" alt="Design 3">
                        <p>Design 3</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/server_script.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
