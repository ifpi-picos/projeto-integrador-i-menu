<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="teste.css"/>
</head>

</div>

  <!-- Botão toggle da sidebar -->
  <button id="toggleSidebar" class="toggle-btn">☰</button>

  <header>
    <a href="index.html" class="logo">iMenu</a>
    <header>
      <nav class="horizontal-nav">
        <a href="index.html" class="nav-button"><p>Início</p></a>
        <a href="pesquisa.html" class="nav-button"><p>Menus</p></a>
        <button id="mapaAba" onclick="localizacao()" class="nav-button"><p>Mapa</p></button>
        <a href="publicar.html" id="publicarAba" onclick="gopublicar()" class="nav-button"><p>Publicar</p></a>
        <button id="editorAba" onclick="goeditor()" class="nav-button"><p>Editor</p></button>
        <a href="perfil.html" class="nav-button" id="perfil_nav"><p>Perfil</p></a>

    </header>
    <div class="auth-buttons">

      </a>

  <section class="hero">
    <h1>Faça mercado no iMenu</h1>
    <div class="search-bar">
      <input id="cidadeInput" type="text" placeholder="Digite sua cidade" />
      <button onclick="buscarRestaurantes()">Ver restaurantes próximos</button>
    </div>
    <!-- Lista de restaurantes encontrados -->
    <ul id="lista-restaurantes"></ul>
  </section>

<div class="categories">
    <div class="category" onclick="filtrarPorCategoria('vegetariano')">Vegetariano</div>
    <div class="category" onclick="filtrarPorCategoria('bebidas')">Bebidas</div>
    <div class="category" onclick="filtrarPorCategoria('refeicoes')">Refeições</div>
    <div class="category" onclick="filtrarPorCategoria('sobremesas')">Sobremesas</div>
    <div class="category" onclick="filtrarPorCategoria('lanches')">Lanches</div>
    <div class="category" onclick="filtrarPorCategoria('sushi')">Sushi</div>
</div>

<div class="main-cards">
    <div class="card red">
        <img src="images/drink.png" alt="Restaurante" />
        <div class="card-content">
            <h3>Bares</h3>
            <button class="btn btn-card" onclick="filtrarPorCategoria('bebidas')">Ver opções</button>
        </div>
    </div>
    <div class="card green">
        <img src="images/hambu.png" alt="Mercado" />
        <div class="card-content">
            <h3>Restaurantes</h3>
            <button class="btn btn-card" onclick="filtrarPorCategoria('refeicoes')">Ver opções</button>
        </div>
    </div>
  </div>

  <section class="section">
    <h2>Cardápios criados recentemente</h2>
    <div class="posts-container">
    <button class="arrow left" onclick="scrollPosts(-1)">&#10094;</button>
    <div id="posts-recentes"></div>
    <button class="arrow right" onclick="scrollPosts(1)">&#10095;</button>
  </div>
</section>

<!-- Restaurantes Famosos -->
<section class="section">
  <h2>Restaurantes Famosos</h2>
  <div class="posts-container">
    <button class="arrow left" onclick="scrollRestaurantes(-1)">&#10094;</button>
    <div class="carousel" id="restaurantes-populares"></div>
    <button class="arrow right" onclick="scrollRestaurantes(1)">&#10095;</button>
  </div>
</section>

  <div id="footer-container"></div>

  <!-- Seu script do servidor e principal -->
<script src="js/server_script.js"></script>
<script src="js/script.js"></script>

<!-- Carrega o Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Inicialização -->
<script>
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-container').innerHTML = data;
    });
  
  //PASSAR POSTS
  function scrollPosts(direction) {
    const container = document.getElementById('posts-recentes');
    const scrollAmount = container.clientWidth / 1.2;
    container.scrollBy({
        left: direction * scrollAmount,
        behavior: 'smooth'
    });
  }

  function scrollRestaurantes(direction) {
    const container = document.getElementById('restaurantes-populares');
    const scrollAmount = container.clientWidth / 1.2;
    container.scrollBy({
      left: direction * scrollAmount,
      behavior: 'smooth'
    });
  }

  async function carregarRestaurantesPopulares() {
    const webservice = "https://imenu-backend-pd3a.onrender.com";
    try {
        const response = await fetch(`${webservice}/restaurantes/populares`);
        if (!response.ok) {
            throw new Error(`Erro: ${response.status}`);
        }
        const restaurantes = await response.json();
        const carousel = document.getElementById('restaurantes-populares');
        if (!carousel) return;
        if (restaurantes.length === 0) {
            carousel.innerHTML = '<p>Nenhum restaurante popular encontrado</p>';
            return;
        }
        carousel.innerHTML = restaurantes.map(restaurante => {
            const restauranteId = restaurante.id;
            if (!restauranteId) return '';
            const fotoUrl = restaurante.foto || 'https://img.freepik.com/vetores-premium/ilustracao-em-vetor-de-foto-de-perfil-minimalista_276184-161.jpg';
            return `
                <div class="carousel-item" onclick="abrirRestaurante('${restauranteId}')">
                    <img src="${fotoUrl}" 
                         alt="${restaurante.name || 'Restaurante'}" 
                         class="restaurant-image"
                         onerror="this.onerror=null;this.src='https://img.freepik.com/vetores-premium/ilustracao-em-vetor-de-foto-de-perfil-minimalista_276184-161.jpg'">
                    <div class="restaurant-info">
                        <h3>${restaurante.name || 'Restaurante'}</h3>
                        ${restaurante.restaurante ? `<p class="restaurant-subtitle">${restaurante.restaurante}</p>` : ''}
                        <div class="restaurant-stats">
                            <span>👁️ ${restaurante.viewsRecentes || 0} visualizações recentes</span>
                            <span>⭐ ${restaurante.avgRating || '0.0'}/5</span>
                            <span>📋 ${restaurante.cardapiosRecentes || 0} cardápios novos</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    } catch (err) {
        console.error("Erro ao carregar restaurantes:", err);
        const carousel = document.getElementById('restaurantes-populares');
        if (carousel) {
            carousel.innerHTML = '<p>Não foi possível carregar os restaurantes no momento.</p>';
        }
    }
  }

  function abrirRestaurante(restauranteId) {
    try {
        if (!restauranteId || restauranteId === 'undefined') {
            throw new Error('ID do restaurante inválido');
        }
        window.location.href = `perfil.html?userId=${restauranteId}`;
    } catch (error) {
        console.error('Erro ao abrir restaurante:', error);
        alert('Não foi possível abrir este restaurante no momento.');
    }
  }

  // NOVA FUNÇÃO: Buscar restaurantes públicos via Overpass API
  async function buscarRestaurantes() {
    const cidade = document.getElementById("cidadeInput").value.trim();
    const lista = document.getElementById("lista-restaurantes");
    lista.innerHTML = "";

    if (!cidade) {
      alert("Digite uma cidade!");
      return;
    }

    try {
      lista.innerHTML = "<li>Carregando restaurantes...</li>";

      // 1. Converte cidade em coordenadas
      const geoResponse = await fetch(
        `https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cidade)}&format=json&limit=1`
      );
      const geoData = await geoResponse.json();
      if (geoData.length === 0) {
        lista.innerHTML = "<li>Cidade não encontrada!</li>";
        return;
      }

      const { lat, lon } = geoData[0];

      // 2. Busca restaurantes no Overpass API
      const query = `
        [out:json];
        node["amenity"="restaurant"](around:5000, ${lat}, ${lon});
        out;
      `;

      const response = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(query),
      });

      const data = await response.json();

      if (!data.elements || data.elements.length === 0) {
        lista.innerHTML = "<li>Nenhum restaurante encontrado.</li>";
        return;
      }

      // 3. Mostra só os nomes
      lista.innerHTML = "";
      data.elements.forEach(r => {
        const li = document.createElement("li");
        li.textContent = r.tags?.name || "Restaurante sem nome";
        lista.appendChild(li);
      });

    } catch (error) {
      console.error("Erro:", error);
      lista.innerHTML = "<li>Erro ao buscar restaurantes.</li>";
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    const sidebar = document.getElementById("sidebar");
    const toggleButton = document.getElementById("toggleSidebar");
    if (toggleButton) {
      toggleButton.addEventListener("click", function () {
        sidebar.classList.toggle("expanded");
      });
    }
    verificarToken();
    lucide.createIcons();
  });
</script>

</body>
</html>
