<!-- HTML Atualizado para Responsividade -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMenu</title>
    <link rel="stylesheet" href="teste.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button id="toggleSidebar" class="nav-button" aria-label="Toggle Sidebar">
                <img src="images/sidebar.png" alt="Menu">
            </button>
            <h1 class="logo">iMenu</h1>
            <nav>
                <a href="index.html" class="nav-button">
                    <img src="images/home.png" alt="Início"> <p>Início</p>
                </a>
                <a href="pesquisa.html" class="nav-button">
                    <img src="images/card.png" alt="Meus Menus"> <p>Menus</p>
                </a>
                <button id="mapaAba" onclick="localizacao()" class="nav-button">
                    <img src="images/local.png" alt="Mapa"> <p>Mapa</p>
                </button>
                <a href="publicar.html" id="publicarAba" onclick="gopublicar()" class="nav-button">
                    <img src="images/publicar.png" alt="Publicar"><p>Publicar</p>
                </a>
                
                <button id="editorAba" onclick="goeditor()" class="nav-button">
                    <img src="images/editor.png" alt="Editor"> <p>Editor</p>
                </button>
                <a href="#" class="nav-button">
                    <img src="images/config.png" alt="Configurações"> <p>Configurações</p>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="content">
            <header class="topbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar...">
                </div>
                <div class="auth-buttons">
                    <a href="perfil.html" id="perfil-link">
                        <img id="perfil" src="images/perfil.png">
                        <p id="username"></p>
                    </a>
                    <button id="button-acount" onclick="goecadastro()" class="register-button">Cadastrar</button>
                    <button id="button-enter" onclick="gologin()" class="login-button">Entrar</button>
                </div>
            </header>
            
            <!-- Promoção / Banner -->
            <section class="promo-banner">
                <img src="images/Bem-vindo ao iMenu - cliente.png" alt="Promoção Especial">
                <div class="mascote-container">
                    <img src="images/mascote.png" alt="Mascote" class="mascote">
                </div>
            </section>

            <!-- Cardápios -->
            <section class="dashboard">
                <h2>Cardápios criados recentemente</h2>
                <div id="posts-recentes">

                </div>
            </section>
        </main>
    </div>
    
    <script src="js/server_script.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sidebar = document.querySelector(".sidebar");
        const toggleButton = document.getElementById("toggleSidebar");

        toggleButton.addEventListener("click", function() {
            sidebar.classList.toggle("expanded");
        });

        verificarToken();
      });
    </script>
</body>
</html>
