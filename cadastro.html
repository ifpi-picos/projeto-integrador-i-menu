<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iMenu</title>
  <link rel="stylesheet" href="cadastro.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Logo iMenu no canto esquerdo -->
  <a href="index.html" class="logo">
    <h1>iMenu</h1>
  </a>

  <div class="box">
    <div class="img-box">
      <label for="profile-pic-upload" class="upload-label">
        <img id="profile-pic-preview" src="images/perfil.png" alt="Foto de Perfil" />
        <p class="upload-hint">Clique na aqui para escolher sua foto de perfil</p>
      </label>
      <input type="file" id="profile-pic-upload" accept="image/*" style="display: none;" />
    </div>

    <div class="form-box">
      <h2>Cadastre-se no iMenu!</h2>
      <p>Já é um membro? <a href="login.html">Login</a></p>

      <!-- Novo seletor de papel -->
      <div class="role-selector">
        <button type="button" class="role-btn active" onclick="selectRole(false)">Cliente</button>
        <button type="button" class="role-btn" onclick="selectRole(true)">Dono de Restaurante</button>
        <input type="checkbox" id="dono" />
        <span id="toggle-text" style="display:none;">Cliente</span>
      </div>

      <!-- Formulário -->
      <form id="formulario" action="#">
        <div class="input-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Digite o seu nome completo" required />
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Digite o seu email" required />
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required />
        </div>

        <div class="input-group">
          <button type="button" class="buttons_normais" id="create" onclick="criaruser()">Cadastre-se</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/server_script.js"></script>
  <script>
    function selectRole(isDono) {
      const checkbox = document.getElementById('dono');
      const toggleText = document.getElementById('toggle-text');
      const buttons = document.querySelectorAll('.role-btn');

      checkbox.checked = isDono;
      toggleText.textContent = isDono ? 'Dono de Restaurante' : 'Cliente';

      buttons.forEach(btn => btn.classList.remove('active'));
      buttons[isDono ? 1 : 0].classList.add('active');
    }

    const fileInput = document.getElementById('profile-pic-upload');
    const previewImage = document.getElementById('profile-pic-preview');

    fileInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });


      // Função para lidar com o upload da foto de perfil
  document.getElementById('profile-pic-upload').addEventListener('change', async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    // Mostrar preview da imagem
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('profile-pic-preview').src = e.target.result;
    };
    reader.readAsDataURL(file);

    // Enviar para o servidor (opcional, se quiser salvar já no cadastro)
    try {
      const formData = new FormData();
      formData.append('file', file);
      
      const response = await fetch(`${webservicef}/api/upload`, {
        method: 'POST',
        body: formData
      });
      
      const data = await response.json();
      if (data.success) {
        imageUrl = data.fileUrl; // Armazena a URL da imagem para usar no cadastro
      }
    } catch (error) {
      console.error('Erro ao enviar foto:', error);
    }
  });

  // Modificar a função criaruser para incluir a foto
  async function criaruser() {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const dono = document.getElementById("dono").checked;

    const novoUsuario = { 
      name: nome, 
      email, 
      password: senha, 
      dono,
      foto: imageUrl || 'images/perfil.png' // Usa a imagem enviada ou a padrão
    };

    try {
      const response = await fetch(`${webservice}/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(novoUsuario)
      });

      const data = await response.json();

      if (response.ok) {
        alert("Usuário criado com sucesso!");
        window.location.href = "./login.html";
      } else {
        alert("Erro ao criar usuário: " + (data.message || "Erro desconhecido"));
      }
    } catch (err) {
      alert("Erro ao criar usuário: " + err.message);
    }
  }
  </script>
</body>

</html>
