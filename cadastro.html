<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Cadastre-se no iMenu</title>
      <link rel="stylesheet" href="cadastro.css">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
   <body>
      <div class="wrapper">
         <div class="title">Cadastre-se no iMenu!</div>
         <div class="slide-controls">
            <label>
               <input type="checkbox" id="dono" onchange="toggleRole()" style="display: none;">
               <span id="toggle-text">Cliente</span>
            </label>
         </div>
         <div class="form-container">
            <form action="#" id="formulario">
               <div class="field">
                  <input type="text" id="nome" placeholder="Username" required>
               </div>
               <div class="field">
                  <input type="email" id="email" placeholder="Endereço de Email" required>
               </div>
               <div class="field">
                  <input type="password" id="senha" placeholder="Senha" required>
               </div>
               <div class="field btn">
                  <button type="button" class="buttons_normais" id="create" onclick="criaruser()">Cadastre-se</button>
               </div>
            </form>
         </div>
      </div>
      <script src="js/server_script.js"></script>
      <script>
         function toggleRole() {
             const toggleText = document.getElementById("toggle-text");
             const donoCheckbox = document.getElementById("dono");
             toggleText.textContent = donoCheckbox.checked ? "Dono de Restaurante" : "Cliente";
         }
      </script>
   </body>
</html>
