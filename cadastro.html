<!DOCTYPE html>
<!-- Created By CodingNepal -->
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Login and Registration Form in HTML | CodingNepal</title>
      <link rel="stylesheet" href="login2.css">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
   <body>
      <div class="wrapper">
         <div class="title-text">
            <div class="title login">
               Cadastro
            </div>
            <div class="title signup">
               Cadastro
            </div>
         </div>
         <div class="form-container">
            <div class="slide-controls">
               <input type="radio" name="slide" id="login" checked>
               <input type="radio" name="slide" id="signup">
               <label for="login" class="slide login">Cliente</label>
               <label for="signup" class="slide signup">Dono</label>
               <div class="slider-tab"></div>
            </div>
            <div class="form-inner">
               <form action="#" id="formulario" class="signup">
                  <div class="field">
                     <input type="text" id="nome" placeholder="Endereço de Email" required>
                  </div>
                  <div class="field">
                     <input type="password" id="senha" placeholder="Senha" required>
                  </div>
                  <div class="field btn">
                     <div class="btn-layer"></div>
                     <button class="buttons_normais" id="create"> Cadastre-se </button>
                  </div>
               </form>
            </div>
         </div>
      </div>
      <script src="script_server.js"></script>
      <script>
         const loginText = document.querySelector(".title-text .login");
         const loginForm = document.querySelector("form.login");
         const signupLink = document.querySelector("form .signup-link a");
         signupBtn.onclick = (()=>{
           loginForm.style.marginLeft = "-50%";
           loginText.style.marginLeft = "-50%";
         });
         loginBtn.onclick = (()=>{
           loginForm.style.marginLeft = "0%";
           loginText.style.marginLeft = "0%";
         });
         signupLink.onclick = (()=>{
           signupBtn.click();
           return false;
         });
      </script>
   </body>
</html>
