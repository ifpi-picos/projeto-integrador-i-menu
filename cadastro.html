<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iMenu - Cadastro</title>
  <link rel="stylesheet" href="cadastro.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide-icons/dist/umd/lucide.min.js"></script>
</head>

<body>
  <a href="index.html" class="logo">
    <h1>iMenu</h1>
  </a>

  <div class="box">
    <div class="img-box">
      <label for="profile-pic-upload" class="upload-label">
        <img id="profile-pic-preview" src="images/perfil.png" alt="Foto de Perfil" />
        <p class="upload-hint">Clique aqui para escolher sua foto de perfil</p>
      </label>
      <input type="file" id="profile-pic-upload" accept="image/*" style="display: none;" />
    </div>

    <div class="form-box">
      <h2>Cadastre-se no iMenu!</h2>
      <p>Já é um membro? <a href="login.html">Login</a></p>

      <div class="role-selector">
        <button type="button" class="role-btn active" onclick="selectRole(false)">Cliente</button>
        <button type="button" class="role-btn" onclick="selectRole(true)">Dono de Restaurante</button>
        <input type="checkbox" id="dono" />
        <span id="toggle-text" style="display:none;">Cliente</span>
      </div>

      <form id="formulario">
        <div class="two-columns">
          <div class="input-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite o seu nome completo" required />
          </div>
          <div class="input-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(xx) xxxxx-xxxx" />
          </div>
        </div>

        <div class="two-columns">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite o seu email" required />
          </div>
          <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required />
          </div>
        </div>

        <div class="two-columns">
          <div class="input-group">
            <label for="estado">Estado</label>
            <select id="estado" required>
              <option value="">Selecione seu estado</option>
            </select>
          </div>
          <div class="input-group">
            <label for="cidade">Cidade</label>
            <select id="cidade" required>
              <option value="">Selecione sua cidade</option>
            </select>
          </div>
        </div>

        <div class="input-group" id="campo-restaurante" style="display: none;">
          <label for="restaurante">Nome do Restaurante</label>
          <input type="text" id="restaurante" placeholder="Digite o nome do restaurante" />
        </div>

        <div class="input-group">
          <button type="button" id="create">Cadastre-se</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/server_script.js"></script>
  <script>
    function selectRole(isDono) {
      const checkbox = document.getElementById('dono');
      const buttons = document.querySelectorAll('.role-btn');
      const campoRestaurante = document.getElementById('campo-restaurante');
      checkbox.checked = isDono;
      buttons.forEach(btn => btn.classList.remove('active'));
      buttons[isDono ? 1 : 0].classList.add('active');
      campoRestaurante.style.display = isDono ? 'block' : 'none';
    }

    async function uploadProfilePicture(file) {
      try {
        const formData = new FormData();
        formData.append('file', file);
        const response = await fetch(`${webservicef}/api/upload`, {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        return data.success ? data.fileUrl : 'images/perfil.png';
      } catch (error) {
        console.error('Erro ao enviar foto:', error);
        return 'images/perfil.png';
      }
    }

async function criaruser() {
    const nome = document.getElementById("nome").value.trim();
    const restaurante = document.getElementById("restaurante").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const telefone = document.getElementById("telefone").value.trim();
    const dono = document.getElementById("dono").checked;
    const createBtn = document.getElementById('create');

    // Validação básica
    if (!nome || !email || !senha) {
        alert("Por favor, preencha todos os campos obrigatórios!");
        return;
    }

    if (senha.length < 6) {
        alert("A senha deve ter pelo menos 6 caracteres");
        return;
    }

    if (dono && !restaurante) {
        alert("Por favor, informe o nome do restaurante.");
        return;
    }

    try {
        createBtn.disabled = true;
        createBtn.textContent = 'Cadastrando...';

        const fileInput = document.getElementById('profile-pic-upload');
        let fotoUrl = 'images/perfil.png';
        
        if (fileInput.files[0]) {
            try {
                fotoUrl = await uploadProfilePicture(fileInput.files[0]);
            } catch (uploadError) {
                console.warn("Erro no upload da foto, usando padrão:", uploadError);
            }
        }

        const estadoValue = document.getElementById("estado").value;
        const estadoId = estadoValue ? parseInt(estadoValue) : undefined;

        const novoUsuario = {
            name: nome,
            email: email,
            password: senha,
            telefone: telefone || "",
            dono: dono,
            foto: fotoUrl,
            restaurante: dono ? restaurante : "",
            estadoId: estadoId,
            estadoNome: document.getElementById("estado").options[document.getElementById("estado").selectedIndex]?.text || "",
            cidadeId: document.getElementById("cidade").selectedIndex > 0 ? 
                parseInt(document.getElementById("cidade").options[document.getElementById("cidade").selectedIndex].dataset.id) : undefined,
            cidadeNome: document.getElementById("cidade").value || ""
        };

        const response = await fetch(`${webservice}/create`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(novoUsuario)
        });

        const data = await response.json();

        if (response.ok) {
            if (data.needsVerification) {
                alert("Cadastro realizado! Verifique seu email para ativar a conta.\n\nSe não receber o email, clique em 'Reenviar verificação' na página de login.");
            } else {
                alert("Cadastro realizado com sucesso! Você já pode fazer login.");
            }
            window.location.href = "./login.html";
        } else {
            const errorMessage = data.message || data.error || "Erro desconhecido";
            alert(`Erro no cadastro: ${errorMessage}`);
        }
    } catch (err) {
        console.error("Erro completo:", err);
        alert("Erro de conexão. Verifique sua internet e tente novamente.");
    } finally {
        createBtn.disabled = false;
        createBtn.textContent = 'Cadastre-se';
    }
}

// --------- ESTADO & CIDADE (IBGE) ---------
    async function carregarEstados() {
    try {
        const response = await fetch("https://servicodados.ibge.gov.br/api/v1/localidades/estados");
        const estados = await response.json();
        const selectEstado = document.getElementById("estado");

        estados.sort((a, b) => a.nome.localeCompare(b.nome));

        estados.forEach(estado => {
            const option = document.createElement("option");
            option.value = Number(estado.id); // Garantir que seja número
            option.textContent = estado.nome;
            option.dataset.sigla = estado.sigla;
            selectEstado.appendChild(option);
        });
    } catch (error) {
        console.error("Erro ao carregar estados:", error);
    }
}

    async function carregarCidades(estadoId) {
      try {
        const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${estadoId}/municipios`);
        const cidades = await response.json();
        const selectCidade = document.getElementById("cidade");

        selectCidade.innerHTML = '<option value="">Selecione sua cidade</option>';

        cidades.forEach(cidade => {
          const option = document.createElement("option");
          option.value = cidade.nome;
          option.textContent = cidade.nome;
          option.dataset.id = cidade.id;   // ID numérico da cidade
          selectCidade.appendChild(option);
        });
      } catch (error) {
        console.error("Erro ao carregar cidades:", error);
      }
    }

    // --------- EVENTOS PRINCIPAIS ---------
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('profile-pic-upload').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.getElementById('profile-pic-preview').src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('create').addEventListener('click', criaruser);

      carregarEstados();
      document.getElementById("estado").addEventListener("change", (e) => {
        if (e.target.value) {
          carregarCidades(e.target.value);
        }
      });

        if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    } else {
        console.warn('Lucide não carregado');
    }
    });
  </script>
</body>
</html>
