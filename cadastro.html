<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Cadastre-se no iMenu</title>
      <link rel="stylesheet" href="cadastro.css">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
   <body>
      <div class="wrapper">
         <div class="title-text">
            <div class="title login">
               Cadastre-se no iMenu!
            </div>
            <div class="title signup">
               Tá esperando o que para se cadastrar?
            </div>
         </div>
         <div class="form-container">
            <div class="slide-controls">
               <label class="slide login" style="background: #3B1D0F; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s;">
                  <input type="checkbox" id="dono" onchange="toggleRole()" style="display: none;">
                  <span class="toggle-btn" id="toggle-text">Cliente</span>
               </label>
               <div class="slider-tab"></div>
            </div>
            <div class="form-inner">
               <form action="#" id="formulario" class="signup">
                  <div class="field">
                     <input type="text" id="nome" placeholder="Username" required>
                  </div>
                  <div class="field">
                     <input type="email" id="email" placeholder="Endereço de Email" required>
                  </div>
                  <div class="field">
                     <input type="password" id="senha" placeholder="Senha" required>
                  </div>
                  <div class="field btn">
                     <div class="btn-layer"></div>
                     <button type="button" class="buttons_normais" id="create" onclick="criaruser()"> Cadastre-se </button>
                  </div>
               </form>
            </div>
         </div>
      </div>
      <script src="js/server_script.js"></script>
      <script>
         function toggleRole() {
             const toggleText = document.getElementById("toggle-text");
             const donoCheckbox = document.getElementById("dono");

             if (donoCheckbox.checked) {
                 toggleText.textContent = "Dono de Restaurante";
             } else {
                 toggleText.textContent = "Cliente";
             }
         }
      </script>
   </body>
</html>
