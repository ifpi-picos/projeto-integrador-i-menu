<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMenu - Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="mapa.css">
</head>
<body>
    <div class="sidebar">
        <a href="index.html">
         <a href="index.html" class="btn-voltar">
    <img src="images/mapa-seta.png" alt="Voltar"> Início
</a>

        </a>
        <h2>🍽️ Restaurantes próximos</h2>
        <p id="date"></p>
        <p>📍 Picos - PI</p>

        <div class="info-box">
            <p>🍔 Restaurantes</p>
            <h3>77</h3>
            <p>🍻 Bares</p>
            <h3>65</h3>
        </div>

        <h3>⭐ Parceiros</h3>
        <ul>
            <li>Verona Pizza</li>
            <li>Espetinho Nosso Sabor</li>
            <li>Só Coxinha</li>
        </ul>
    </div>

    <div class="map-container">
        <div class="header">
            <div class="nav">
                <a href="index.html">Início</a>
                <a href="index.html">Menus</a>
                <a href="mapa.html" class="active">Mapa</a>
                <a href="perfil.html">Perfil</a>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        document.getElementById('date').textContent = new Date().toLocaleDateString('pt-BR', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
    </script>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-7.0079, -41.4664], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var fastFoodIcon = L.icon({
            iconUrl: 'images/pino-mapa.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        var overpassUrl = "https://overpass-api.de/api/interpreter?data=[out:json][timeout:25];area(id:3600302661)->.searchArea;nwr[\"amenity\"=\"fast_food\"](area.searchArea);out geom;";

        fetch(overpassUrl)
            .then(response => response.json())
            .then(data => {
                data.elements.forEach(function(element) {
                    if (element.type === 'node') {
                        L.marker([element.lat, element.lon], { icon: fastFoodIcon }).addTo(map)
                            .bindPopup("<b>Fast Food</b><br/>" + (element.tags.name || "Sem nome"));
                    } else if (element.type === 'way') {
                        var coords = element.geometry.map(function(geo) {
                            return [geo.lat, geo.lon];
                        });
                        L.polygon(coords).addTo(map)
                            .bindPopup("<b>Fast Food</b><br/>" + (element.tags.name || "Sem nome"));
                    }
                });
            });
    </script>
</body>
</html>
