<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMenu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="mapa.css">
</head>
<body>
    <div class="sidebar">
        <h2>Restaurantes perto de você!</h2>
        <p id="date"></p>
        <p>📍 Picos - PI</p>
        <hr>
        <p>Restaurantes na sua região</p>
        <h3>77</h3>
        <p>Bares na sua região</p>
        <h3>65</h3>
        <hr>
        <h2>Nossos restaurantes parceiros!</h2>
        <p>Verona Pizza</p>
        <p>Lanchonete e Espetinho: Nosso Sabor</p>
        <p>Lanchonete Só coxinha</p>
    </div>
    <div class="map-container">
        <div class="header">
            <div class="nav">
                <a href="index.html">Início</a>
                <a href="index.html">Sugestões</a>
                <a href="index.html">Histórico</a>
                <a href="pesquisa.html">Pesquisar</a>
                <a href="mapa.html">Mapa</a>
            </div>
            <div class="login-buttons">
                <a href="login.html">Entrar</a>
                <a href="cadastro.html">Cadastrar</a>
            </div>
        </div>
        <div id="map"></div>
    </div>
    <script>
        document.getElementById('date').textContent = new Date().toLocaleDateString('pt-BR', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
    </script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-7.0079, -41.4664], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var fastFoodIcon = L.icon({
            iconUrl: 'https://png.pngtree.com/png-vector/20221130/ourmid/pngtree-restaurant-location-pin-icon-in-gold-yellow-color-png-image_6485373.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        var overpassUrl = "https://overpass-api.de/api/interpreter?data=[out:json][timeout:25];area(id:3600302661)->.searchArea;nwr[\"amenity\"=\"fast_food\"](area.searchArea);out geom;";

fetch(overpassUrl)
    .then(response => response.json())
    .then(data => {
       
        data.elements.forEach(function(element) {
            
            if (element.type === 'node' && element.tags.amenity === 'fast_food') {
                L.marker([element.lat, element.lon], { icon: fastFoodIcon }).addTo(map)
                    .bindPopup("<b>Fast Food</b><br/>" + (element.tags.name || "Sem nome"));
            }

            else if (element.type === 'way' && element.tags.amenity === 'fast_food') {
                var coords = element.geometry.map(function(geo) {
                    return [geo.lat, geo.lon];
                });
                L.polygon(coords).addTo(map)
                    .bindPopup("<b>Fast Food</b><br/>" + (element.tags.name || "Sem nome"));
            }
        });
    })
    </script>
</body>
</html>
