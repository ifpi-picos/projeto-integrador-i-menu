<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Configurações</title>
  <link rel="stylesheet" href="configuracoes.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bodyp">

<header class="headerperfil d-flex align-items-center justify-content-between px-3">
  <div class="d-flex align-items-center">
    <a href="perfil.html" class="icon-back me-2" aria-label="Voltar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h4 class="mb-0">Configurações</h4>
  </div>
  <button class="btn-logout" onclick="logout()" style="display: flex; align-items: center; gap: 8px;">
    <i data-lucide="log-out"></i> Sair
  </button>
</header>

<div class="container mt-4">
  <div class="profile-pic text-center mb-3">
    <img id="profile-img" src="images/perfil.png" class="rounded-circle" width="100" height="100" style="object-fit: cover;" />
    <div>
      <a href="#" class="edit-photo" onclick="editarFotoPerfil()">Alterar foto</a>
    </div>
  </div>

  <form id="form-config">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" id="nome" class="form-control" />
    </div>

    <!-- Só aparece se for dono -->
    <div class="mb-3" id="campo-restaurante-config" style="display: none;">
      <label for="nome-restaurante" class="form-label">Nome do Restaurante</label>
      <input type="text" id="nome-restaurante" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" id="senha" class="form-control" placeholder="********" />
    </div>

    <!-- Botão para avançadas -->
    <button type="button" class="btn-avancadas w-100" onclick="toggleAvancadas()">
      Configurações Avançadas ▼
    </button>

    <!-- Seção avançada -->
    <div id="avancadas" style="display:none; margin-top:20px;">
      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000">
      </div>
      <div class="mb-3 dono-only" style="display:none;">
        <label class="form-label">Endereço do Restaurante</label>
        <input type="text" id="endereco-restaurante" class="form-control">
      </div>
      <div class="mb-3 dono-only" style="display:none;">
        <label class="form-label">Horário de Funcionamento</label>
        <select id="horario-funcionamento" class="form-control">
          <option value="">Selecione um horário</option>
          <option value="Seg-Sex 08h-18h">Seg-Sex 08h-18h</option>
          <option value="Seg-Sáb 09h-20h">Seg-Sáb 09h-20h</option>
          <option value="Seg-Dom 10h-22h">Seg-Dom 10h-22h</option>
          <option value="24 horas">24 horas</option>
          <option value="Personalizado">Personalizado</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Notificações</label>
        <select id="notificacoes" class="form-control">
          <option value="todas">Receber todas</option>
          <option value="importantes">Apenas importantes</option>
          <option value="nenhuma">Nenhuma</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Tema</label>
        <select id="tema" class="form-control">
          <option value="claro">Claro</option>
          <option value="escuro">Escuro</option>
        </select>
      </div>
      <button type="button" class="btn-cancelar w-100">Excluir conta</button>
    </div>

    <div class="d-flex justify-content-between mt-3">
      <button type="button" class="btn-cancelar" onclick="history.back()">Cancelar</button>
      <button type="submit" class="btn-salvar">Salvar</button>
    </div>
  </form>
</div>

<script src="js/script.js"></script>
<script src="js/server_script.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
  lucide.createIcons();

  function toggleAvancadas() {
    const secao = document.getElementById("avancadas");
    const botao = document.querySelector(".btn-avancadas");

    if (secao.style.display === "none" || secao.style.display === "") {
      secao.style.display = "block";
      botao.innerHTML = "Configurações Avançadas ▲";
    } else {
      secao.style.display = "none";
      botao.innerHTML = "Configurações Avançadas ▼";
    }
  }

  function parseJwt(token) {
    try {
      return JSON.parse(atob(token.split('.')[1]));
    } catch (e) {
      return null;
    }
  }

  function exibirCamposDono() {
    document.querySelectorAll(".dono-only").forEach(field => {
      field.style.display = "block";
    });
  }

  // Mostrar campo personalizado se for escolhido
  document.getElementById('horario-funcionamento').addEventListener('change', function() {
    let personalizado = document.getElementById('horario-personalizado');
    if (this.value === "Personalizado") {
      if (!personalizado) {
        personalizado = document.createElement('input');
        personalizado.type = 'text';
        personalizado.id = 'horario-personalizado';
        personalizado.placeholder = 'Digite seu horário...';
        personalizado.className = 'form-control mt-2';
        this.insertAdjacentElement('afterend', personalizado);
      }
    } else {
      if (personalizado) personalizado.remove();
    }
  });

  async function carregarDadosUsuario() {
    const token = localStorage.getItem("auth_token");
    if (!token) return;

    try {
      const res = await fetch(`${webservice}/dados`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      document.getElementById('nome').value = data.name || '';
      document.getElementById('email').value = data.email || '';
      document.getElementById('telefone').value = data.telefone || '';
      document.getElementById('notificacoes').value = data.notificacoes || 'todas';
      document.getElementById('tema').value = data.tema || 'claro';

      if (data.horario) {
        const select = document.getElementById('horario-funcionamento');
        if ([...select.options].some(opt => opt.value === data.horario)) {
          select.value = data.horario;
        } else {
          select.value = "Personalizado";
          const personalizado = document.createElement('input');
          personalizado.type = 'text';
          personalizado.id = 'horario-personalizado';
          personalizado.value = data.horario;
          personalizado.className = 'form-control mt-2';
          select.insertAdjacentElement('afterend', personalizado);
        }
      }

      if (data.foto) {
        document.getElementById('profile-img').src = data.foto;
      }

      if (data.dono) {
        document.getElementById('campo-restaurante-config').style.display = 'block';
        document.getElementById('nome-restaurante').value = data.restaurante || '';
        document.getElementById('endereco-restaurante').value = data.endereco || '';
        exibirCamposDono();
      }

    } catch (e) {
      console.error("Erro ao carregar dados:", e);
    }
  }

  document.getElementById("form-config").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const telefone = document.getElementById("telefone").value.trim();
    const notificacoes = document.getElementById("notificacoes").value;
    const tema = document.getElementById("tema").value;
    const endereco = document.getElementById("endereco-restaurante")?.value.trim();

    let horario = document.getElementById("horario-funcionamento").value;
    const horarioPers = document.getElementById("horario-personalizado");
    if (horario === "Personalizado" && horarioPers) {
      horario = horarioPers.value.trim();
    }

    const token = localStorage.getItem("auth_token");
    if (!token) {
      alert("Você precisa estar logado para atualizar seus dados");
      window.location.href = "login.html";
      return;
    }

    if (!nome || !email) {
      alert("Nome e email são obrigatórios");
      return;
    }

    const btnSalvar = document.querySelector('.btn-salvar');
    const originalText = btnSalvar.textContent;
    btnSalvar.disabled = true;
    btnSalvar.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Salvando...';

    try {
      const body = {
        name: nome,
        email: email,
        telefone: telefone,
        notificacoes: notificacoes,
        tema: tema
      };

      if (senha && senha.trim() !== '') {
        if (senha.length < 6) {
          alert("Senha deve ter pelo menos 6 caracteres");
          return;
        }
        body.password = senha;
      }

      const tokenData = parseJwt(token);
      if (tokenData?.dono) {
        body.restaurante = document.getElementById("nome-restaurante").value.trim();
        body.endereco = endereco;
        body.horario = horario;
      }

      const res = await fetch(`${webservice}/user/update`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.message || "Erro ao atualizar");

      if (email !== parseJwt(token).email && data.token) {
        localStorage.setItem("auth_token", data.token);
      }

      const alertDiv = document.createElement('div');
      alertDiv.className = 'alert alert-success mt-3';
      alertDiv.textContent = 'Dados atualizados com sucesso!';
      document.getElementById("form-config").appendChild(alertDiv);
      setTimeout(() => alertDiv.remove(), 3000);

    } catch (error) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'alert alert-danger mt-3';
      errorDiv.textContent = `Erro ao atualizar: ${error.message || "Tente novamente mais tarde"}`;
      document.getElementById("form-config").appendChild(errorDiv);
      setTimeout(() => errorDiv.remove(), 5000);
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.textContent = originalText;
    }
  });

  function logout() {
    localStorage.removeItem("auth_token");
    window.location.href = "login.html";
  }

  window.onload = carregarDadosUsuario;
</script>

</body>
</html>
