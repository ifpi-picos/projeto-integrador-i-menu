<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Publicação de Cardápio</title>
  <link rel="stylesheet" href="publicar.css" />
</head>
<body>
  <div id="header-container"></div>

  <div class="wrapper">
    <div class="container">

      <!-- Upload da imagem de capa -->
      <label class="upload-box">
        <input type="file" accept="image/*" id="upload_card" onchange="previewFile(event)">
        <i data-lucide="image" class="upload-icon"></i>
        <span id="upload-text">Imagem de Capa</span>
        <img id="preview" src="" alt="" style="display:none; width:100%; height:100%; border-radius:10px;">
      </label>

      <!-- Upload do arquivo do cardápio -->
      <label class="upload-box">
        <input type="file" accept=".pdf,application/pdf,image/*" id="upload_arquivo" onchange="previewArquivo(event)">
        <i data-lucide="file-text" class="upload-icon"></i>
        <span id="upload-text-arquivo">Escolha o arquivo do cardápio (PDF ou imagem)</span>
        <img id="preview-arquivo" src="" alt="" style="display:none; width:100%; height:100%; border-radius:10px;">
      </label>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="form-section">
        <label>Título</label>
        <input id="title" type="text" placeholder="Adicione um título" required>

        <label>Descrição</label>
        <textarea id="content" placeholder="Adicione uma descrição detalhada"></textarea>

        <label>Link</label>
        <input type="text" id="linksocial" placeholder="Adicione um link">

        <!-- Tags -->
        <label>Tags (Selecione até 3 categorias)</label>
        <div class="tags-container">
          <label class="tag-option"><input type="checkbox" name="tags" value="bebidas"> Bebidas</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="refeicoes"> Refeições</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="sobremesas"> Sobremesas</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="lanches"> Lanches</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="sushi"> Sushi</label>
          <label class="tag-option"><input type="checkbox" name="tags" value="vegetariano"> Vegetariano</label>
        </div>

        <div class="radio-group">
          <label><input type="radio" name="privacidade" id="public" value="publico"> Público</label>
          <label><input type="radio" name="privacidade" id="private" value="privado" checked> Privado</label>
        </div> 

        <div id="result"></div>
        <input id="linkimg" type="hidden">

        <div class="button-group">
          <button id="postar_btn">Postar</button>
          <button class="back-button" onclick="window.location.href='index.html'">Voltar para o início</button>
        </div>
        <div id="result"></div>
      </div>
    </div>
  </div>

  <input type="hidden" id="linkimg" name="capa" value="">

  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="js/server_script.js"></script>
  <script src="js/script.js"></script>
  <script src="js/cabecalho.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    lucide.createIcons();

    fetch('cabecalho.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        if (typeof initCabecalho === 'function') initCabecalho();
      });

    fetch('footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-container').innerHTML = data;
      });

    let isSubmitting = false;

    function showLoading(show) {
      const btn = document.getElementById('postar_btn');
      btn.disabled = show;
      btn.innerHTML = show ? '<span class="spinner"></span> Enviando...' : 'Publicar Cardápio';
    }

    function showError(message) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `<p class="error-message">❌ ${message}</p>`;
      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    function previewFile(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('preview');
      const uploadText = document.getElementById('upload-text');
      const icon = event.target.parentElement.querySelector('.upload-icon'); // NOVO

      if (file) {
        if (file.size > 10 * 1024 * 1024) {
          showError('O arquivo deve ter no máximo 10MB');
          event.target.value = '';
          return;
        }
        if (file.type.match('image.*')) {
          const reader = new FileReader();
          reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            uploadText.style.display = 'none';
            if (icon) icon.style.display = 'none'; // NOVO
          };
          reader.readAsDataURL(file);
        } else {
          showError('Por favor, selecione apenas imagens para a capa');
          event.target.value = '';
        }
      } else {
        preview.style.display = 'none';
        uploadText.style.display = 'block';
        if (icon) icon.style.display = 'block'; // NOVO
      }
    }

    function previewArquivo(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('preview-arquivo');
      const uploadText = document.getElementById('upload-text-arquivo');
      const icon = event.target.parentElement.querySelector('.upload-icon'); // NOVO

      if (file) {
        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isImage = file.type.match('image.*');

        if (!isPDF && !isImage) {
          showError('Por favor, selecione apenas arquivos PDF ou imagens.');
          event.target.value = '';
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          showError('O arquivo deve ter no máximo 10MB');
          event.target.value = '';
          return;
        }

        if (isPDF) {
          preview.src = 'https://cdn-icons-png.flaticon.com/512/337/337946.png';
          preview.style.display = 'block';
          uploadText.textContent = file.name;
          if (icon) icon.style.display = 'none'; // NOVO
        } else {
          const reader = new FileReader();
          reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            uploadText.style.display = 'none';
            if (icon) icon.style.display = 'none'; // NOVO
          };
          reader.readAsDataURL(file);
        }
      } else {
        preview.style.display = 'none';
        uploadText.style.display = 'block';
        if (icon) icon.style.display = 'block'; // NOVO
      }
    }

    async function enviarArquivo(inputId) {
      const input = document.getElementById(inputId);
      const file = input?.files[0];
      if (!file) return null;

      if (inputId === 'upload_arquivo') {
        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isImage = file.type.match('image.*');
        if (!isPDF && !isImage) throw new Error('Apenas arquivos PDF ou imagens são permitidos');
      }

      if (file.size > 25 * 1024 * 1024) throw new Error('Arquivo muito grande (máx. 25MB)');

      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressContainer');
      progressBar.style.width = '0%';
      progressContainer.style.display = 'block';

      const fileBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.onprogress = e => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = `${percent}%`;
            progressBar.setAttribute('aria-valuenow', percent);
          }
        };
        reader.readAsDataURL(file);
      });

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 180000);

      const res = await fetch(`${webservicef}/api/upload`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'Origin': 'https://www.imenucorp.shop'
        },
        body: JSON.stringify({ file: fileBase64, fileType: file.type, isCardapio: inputId === 'upload_arquivo' }),
        signal: controller.signal
      });

      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.error || `Erro ${res.status}: ${res.statusText}`);
      }

      const data = await res.json();
      progressBar.style.width = '100%';
      progressBar.style.backgroundColor = '#4CAF50';

      setTimeout(() => progressContainer.style.display = 'none', 2000);
      return data;
    }

    document.addEventListener('DOMContentLoaded', () => {
      verificarToken();
      document.getElementById('postar_btn').addEventListener('click', e => {
        e.preventDefault();
        enviarPostCompleto();
      });
    });
  </script>
</body>
</html>
