<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicação de Cardápio</title>
    <link rel="stylesheet" href="publicar.css" />
    <style>
        #result {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #e6ffed;
            color: #2d9735;
            border: 1px solid #2d9735;
        }
        .error {
            background-color: #ffebee;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }
        #postar_btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .progress-container {
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        .progress-bar {
            height: 10px;
            background-color: #4CAF50;
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='index.html'">Voltar</button>
    <div class="container">
        <label class="upload-box">
            <input type="file" id="upload_card" accept="image/*" onchange="previewImage(event)">
            <span id="upload-text">Escolha um arquivo</span>
            <img id="preview" src="" alt="" style="display:none; width:100%; height:100%; border-radius:10px;">
        </label>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="form-section">
            <label>Título</label>
            <input id="title" type="text" placeholder="Adicione um título" required>

            <label>Descrição</label>
            <textarea id="content" placeholder="Adicione uma descrição detalhada"></textarea>

            <label>Link</label>
            <input type="text" id="linksocial" placeholder="Adicione um link">

            <div class="radio-group">
                <label><input type="radio" name="privacidade" id="public" value="publico"> Público</label>
                <label><input type="radio" name="privacidade" id="private" value="privado" checked> Privado</label>
            </div> 

            <div id="result"></div>
            <input id="linkimg" type="hidden">

            <div class="button-group">
                <button id="postar_btn">Publicar Cardápio</button>
            </div>
        </div>
    </div>

    <script>


        const fileInput = document.getElementById('upload_card');
        const preview = document.getElementById('preview');
        const uploadText = document.getElementById('upload-text');
        const postButton = document.getElementById('postar_btn');
        const resultDiv = document.getElementById('result');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const linkSocialInput = document.getElementById('linksocial');

        // Mostra pré-visualização da imagem
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    uploadText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        // Função para mostrar resultado
        function showResult(message, type) {
            resultDiv.innerHTML = `<p class="${type}">${message}</p>`;
        }

        // Função para simular progresso (opcional)
        function simulateProgress() {
            progressContainer.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 90) {
                    clearInterval(interval);
                } else {
                    width += 10;
                    progressBar.style.width = width + '%';
                }
            }, 300);
            return interval;
        }

// Envia para o servidor quando clicar em "Publicar"
postButton.addEventListener('click', async () => {
    const file = fileInput.files[0];
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    const linkSocial = linkSocialInput.value.trim();
    const isPublic = document.getElementById('public').checked;
    
    // Validação básica
    if (!file) {
        showResult('❌ Selecione uma imagem para continuar', 'error');
        return;
    }
    
    if (!title) {
        showResult('❌ Adicione um título para o cardápio', 'error');
        return;
    }

    // Configura estado do botão
    postButton.disabled = true;
    postButton.textContent = "Enviando...";
    
    // Mostra barra de progresso
    const progressInterval = simulateProgress();

    try {
        // Converte a imagem para base64
        const base64Image = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(file);
        });

        // 1. Primeiro faz upload da imagem
        const response = await fetch('https://imenu-back-files.onrender.com/api/cardapio', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
            },
            body: JSON.stringify({ 
                imagem: base64Image,
                title,
                content,
                linksocial: linkSocial,
                privacidade: isPublic ? 'publico' : 'privado'
            })
        });

        if (!response.ok) {
            throw new Error(response.statusText || "Erro ao publicar cardápio");
        }

        const result = await response.json();
        
        if (!result.imageUrl) {
            throw new Error("URL da imagem não retornada");
        }

        // 2. Define o link da imagem no campo hidden
        document.getElementById("linkimg").value = result.imageUrl;
        
        // 3. Agora chama a função postar
        await postar(); // Adicione await para garantir a conclusão

    showResult(`✅ Cardápio publicado com sucesso! Redirecionando...`, 'success');

// Redireciona após 2 segundos (tempo para o usuário ver a mensagem)
setTimeout(() => {
    window.location.href = "index.html";
}, 2000);

    } catch (error) {
        console.error("Erro no upload:", error);
        showResult(`❌ Erro: ${error.message}`, 'error');
    } finally {
        clearInterval(progressInterval);
        postButton.disabled = false;
        postButton.textContent = "Publicar Cardápio";
    }
});

// Função postar corrigida
async function postar() {
    const webservice = "https://imenu-backend-yp5c.onrender.com";
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;
    const link = document.getElementById("linksocial").value;
    const isPublic = document.getElementById("public").checked;
    const capa = document.getElementById("linkimg").value;

    const token = localStorage.getItem("auth_token");
    
    if (!token) {
        alert("Você precisa fazer login primeiro");
        window.location.href = "./login.html";
        return;
    }

    const novoPost = { 
        title, 
        content, 
        sociallink: link,  // Corrigido para match com o backend
        publice: isPublic, // Envia true/false diretamente
        capa 
    };

    try {
        const response = await fetch(`${webservice}/post`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(novoPost)
        });

        if (response.status === 401) {
            alert("Sessão expirada. Por favor, faça login novamente.");
            localStorage.removeItem('auth_token');
            window.location.href = "./login.html";
            return;
        }

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || "Erro ao criar post");
        }

        return await response.json(); // Retorna os dados da resposta
    } catch (err) {
        console.error("Erro detalhado:", err);
        throw err; // Propaga o erro para ser tratado no caller
    }
}
    </script>
</body>
</html>
