<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Publicação de Cardápio</title>
  <link rel="stylesheet" href="publicar.css" />
</head>
<body>
  <div id="header-container"></div>

  <div class="wrapper">
    <div class="container">
      <label class="upload-box">
        <input type="file" accept="image/*" id="upload_card" onchange="previewFile(event)">
        <span id="upload-text">Imagem de Capa</span>
        <img id="preview" src="" alt="" style="display:none; width:100%; height:100%; border-radius:10px;">
      </label>

      <label class="upload-box" style="margin-top: 15px;">
        <input type="file" accept=".pdf,application/pdf,image/*" id="upload_arquivo" onchange="previewArquivo(event)">
        <span id="upload-text-arquivo">Escolha o arquivo do cardápio (PDF ou imagem)</span>
        <img id="preview-arquivo" src="" alt="" style="display:none; width:100%; height:100%; border-radius:10px;">
      </label>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="form-section">
        <label>Título</label>
        <input id="title" type="text" placeholder="Adicione um título" required>

        <label>Descrição</label>
        <textarea id="content" placeholder="Adicione uma descrição detalhada"></textarea>

        <label>Link</label>
        <input type="text" id="linksocial" placeholder="Adicione um link">

        <div class="radio-group">
          <label><input type="radio" name="privacidade" id="public" value="publico"> Público</label>
          <label><input type="radio" name="privacidade" id="private" value="privado" checked> Privado</label>
        </div> 

        <div id="result"></div>
        <input id="linkimg" type="hidden">

        <div class="button-group">
          <button id="postar_btn">Postar</button>
          <button class="back-button" onclick="window.location.href='index.html'">Voltar para o início</button>
        </div>
        <div id="result"></div>
      </div>
    </div>
  </div>

  <input type="hidden" id="linkimg" name="capa" value="">

  <script src="js/script.js"></script>
  <script src="js/cabecalho.js"></script>
  <script src="js/server_script.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    fetch('cabecalho.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        if (typeof initCabecalho === 'function') initCabecalho();
      });

    // ----------------- TODAS AS FUNÇÕES JS AQUI -----------------
    const webservice = "https://imenu-backend-pd3a.onrender.com";
    const webservicef = "https://imenu-back-files.onrender.com";
    let isSubmitting = false;

    function showLoading(show) {
      const btn = document.getElementById('postar_btn');
      btn.disabled = show;
      btn.innerHTML = show ? '<span class="spinner"></span> Enviando...' : 'Publicar Cardápio';
    }

    function showError(message) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `<p class="error-message">❌ ${message}</p>`;
      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    function previewFile(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('preview');
      const uploadText = document.getElementById('upload-text');

      if (file) {
        if (file.size > 10 * 1024 * 1024) {
          showError('O arquivo deve ter no máximo 10MB');
          event.target.value = '';
          return;
        }
        if (file.type.match('image.*')) {
          const reader = new FileReader();
          reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            uploadText.style.display = 'none';
          };
          reader.readAsDataURL(file);
        } else {
          showError('Por favor, selecione apenas imagens para a capa');
          event.target.value = '';
        }
      } else {
        preview.style.display = 'none';
        uploadText.style.display = 'block';
        uploadText.textContent = 'Escolha uma imagem para capa';
      }
    }

    function previewArquivo(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('preview-arquivo');
      const uploadText = document.getElementById('upload-text-arquivo');

      if (file) {
        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isImage = file.type.match('image.*');

        if (!isPDF && !isImage) {
          showError('Por favor, selecione apenas arquivos PDF ou imagens.');
          event.target.value = '';
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          showError('O arquivo deve ter no máximo 10MB');
          event.target.value = '';
          return;
        }

        if (isPDF) {
          preview.src = 'https://cdn-icons-png.flaticon.com/512/337/337946.png';
          preview.style.display = 'block';
          uploadText.textContent = file.name;
        } else {
          const reader = new FileReader();
          reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            uploadText.style.display = 'none';
          };
          reader.readAsDataURL(file);
        }
      } else {
        preview.style.display = 'none';
        uploadText.style.display = 'block';
      }
    }

    async function enviarArquivo(inputId) {
      const input = document.getElementById(inputId);
      const file = input?.files[0];
      if (!file) return null;

      if (inputId === 'upload_arquivo') {
        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isImage = file.type.match('image.*');
        if (!isPDF && !isImage) throw new Error('Apenas arquivos PDF ou imagens são permitidos');
      }

      if (file.size > 25 * 1024 * 1024) throw new Error('Arquivo muito grande (máx. 25MB)');

      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressContainer');
      progressBar.style.width = '0%';
      progressContainer.style.display = 'block';

      const fileBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.onprogress = e => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = `${percent}%`;
            progressBar.setAttribute('aria-valuenow', percent);
          }
        };
        reader.readAsDataURL(file);
      });

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 180000);

      const res = await fetch(`${webservicef}/api/upload`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ file: fileBase64, fileType: file.type, isCardapio: inputId === 'upload_arquivo' }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Erro ${res.status}`);
      }

      const data = await res.json();
      progressBar.style.width = '100%';
      progressBar.style.backgroundColor = '#4CAF50';

      setTimeout(() => progressContainer.style.display = 'none', 2000);
      return data;
    }

    async function enviarPostCompleto() {
      if (isSubmitting) return;
      isSubmitting = true;
      showLoading(true);

      try {
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        if (!title) throw new Error('Por favor, adicione um título');
        if (!content) throw new Error('Por favor, adicione uma descrição');

        const capa = await enviarArquivo('upload_card');
        const arquivo = await enviarArquivo('upload_arquivo');
        const link = document.getElementById("linksocial").value.trim();
        const publice = document.getElementById("public").checked;
        const token = localStorage.getItem("auth_token");
        if (!token) return window.location.href = "./login.html";

        const postData = { title, content, sociallink: link || null, publice, capa: capa?.fileUrl, arquivo: arquivo?.fileUrl };

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);

        const res = await fetch(`${webservice}/post`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(postData),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          if (res.status === 401) {
            localStorage.removeItem('auth_token');
            return window.location.href = "./login.html";
          }
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || err.message || `Erro ${res.status}`);
        }

        alert("Cardápio publicado com sucesso!");
        window.location.href = "./index.html";

      } catch (err) {
        console.error(err);
        showError(err.message || 'Erro inesperado');
      } finally {
        isSubmitting = false;
        showLoading(false);
      }
    }

    async function verificarToken() {
      const token = localStorage.getItem("auth_token");
      if (!token) return window.location.href = "./login.html";

      try {
        const res = await fetch(`${webservice}/dados`, {
          method: "GET",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) {
          localStorage.removeItem('auth_token');
          return window.location.href = "./login.html";
        }

        const data = await res.json();
        if (!data.dono) {
          alert("Apenas donos de restaurante podem publicar cardápios");
          window.location.href = "./index.html";
        }
      } catch (err) {
        window.location.href = "./login.html";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      verificarToken();
      document.getElementById('postar_btn').addEventListener('click', e => {
        e.preventDefault();
        enviarPostCompleto();
      });
    });
  </script>
</body>
</html>
