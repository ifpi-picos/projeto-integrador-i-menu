<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicação de Cardápio</title>
    <link rel="stylesheet" href="publicar.css" />
</head>
<body>
    <div class="container">
        <label class="upload-box">
            <input type="file" accept="image/*,application/pdf" id="upload_card" onchange="previewFile(event)">
            <span id="upload-text">Escolha um arquivo</span>
            <img id="preview" src="" alt="" style="display:none; width:100%; height:100%; border-radius:10px;">
        </label>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="form-section">
            <label>Título</label>
            <input id="title" type="text" placeholder="Adicione um título" required>

            <label>Descrição</label>
            <textarea id="content" placeholder="Adicione uma descrição detalhada"></textarea>

            <label>Link</label>
            <input type="text" id="linksocial" placeholder="Adicione um link">

            <div class="radio-group">
                <label><input type="radio" name="privacidade" id="public" value="publico"> Público</label>
                <label><input type="radio" name="privacidade" id="private" value="privado" checked> Privado</label>
            </div> 

            <div id="result"></div>
            <input id="linkimg" type="hidden">

            <div class="button-group">
                <button id="postar_btn">Postar</button>
                <button class="back-button" onclick="window.location.href='index.html'">Voltar para o inicio</button>
            </div>
            <div id="result"></div>
        </div>
    </div>
    <input type="hidden" id="linkimg" name="capa" value="">

    <script>
// Configurações
const webservice = "https://imenu-backend-pd3a.onrender.com";
const webservicef = "https://imenu-back-files.onrender.com";
let imageUrl = '';
let isSubmitting = false; // Flag para evitar múltiplos envios

// Função para mostrar feedback visual
function showLoading(show) {
    const postarBtn = document.getElementById('postar_btn');
    if (show) {
        postarBtn.disabled = true;
        postarBtn.innerHTML = '<span class="spinner"></span> Enviando...';
    } else {
        postarBtn.disabled = false;
        postarBtn.textContent = 'Publicar Cardápio';
    }
}

// Função para mostrar mensagem de erro
function showError(message) {
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `<p class="error-message">❌ ${message}</p>`;
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}

// Função para preview da imagem
function previewFile(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('preview');
    const uploadText = document.getElementById('upload-text');
    
    if (file) {
        if (file.size > 10 * 1024 * 1024) { // Aumente para 10MB
            showError('O arquivo deve ter no máximo 10MB');
            event.target.value = '';
            return;
        }

        // Se for PDF
        if (file.type === 'application/pdf') {
            preview.src = 'https://cdn-icons-png.flaticon.com/512/337/337946.png'; // Ícone de PDF
            preview.style.display = 'block';
            uploadText.textContent = file.name;
            uploadText.style.display = 'block';
            return;
        }

        // Se for imagem
        if (file.type.match('image.*')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                uploadText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        } else {
            showError('Tipo de arquivo não suportado');
            event.target.value = '';
        }
    } else {
        preview.style.display = 'none';
        uploadText.style.display = 'block';
        uploadText.textContent = 'Escolha um arquivo';
    }
}
// Função para enviar imagem com timeout
async function enviarArquivo() {
    const fileInput = document.getElementById('upload_card');
    const file = fileInput.files[0];
    
    if (!file) {
        console.log("Nenhum arquivo selecionado");
        return null;
    }

    // Configura timeout de 30 segundos
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    try {
        const fileBase64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });

        const response = await fetch(`${webservicef}/api/upload`, { // Mudei a rota
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ 
                file: fileBase64,
                fileType: file.type 
            }),
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || `Erro ${response.status}`);
        }
        
        const data = await response.json();
        return data.fileUrl || null;
    } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') {
            throw new Error('Tempo excedido no upload do arquivo');
        }
        throw error;
    }
}
// Função principal para enviar o post completo
async function enviarPostCompleto() {
    if (isSubmitting) return;
    isSubmitting = true;
    showLoading(true);

    try {
        // Validação básica
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        
        if (!title) throw new Error('Por favor, adicione um título');
        if (!content) throw new Error('Por favor, adicione uma descrição');

        // Upload da imagem (se houver)
try {
            imageUrl = await enviarArquivo(); // Mudei para a nova função
        } catch (uploadError) {
            console.warn("Erro no upload do arquivo:", uploadError.message);
            imageUrl = null;
        }

        // Preparar dados do post
        const link = document.getElementById("linksocial").value.trim();
        const publice = document.getElementById("public").checked;
        const token = localStorage.getItem("auth_token");
        
        if (!token) {
            window.location.href = "./login.html";
            return;
        }

        const postData = { 
            title, 
            content, 
            sociallink: link || null, 
            publice, 
            capa: imageUrl || null
        };

        // Enviar post com timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const response = await fetch(`${webservice}/post`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(postData),
            signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.message || `Erro ${response.status}`);
        }

        // Sucesso - redireciona
        alert("Cardápio publicado com sucesso!");
        window.location.href = "./index.html";

    } catch (error) {
        console.error("Erro ao publicar:", error);
        showError(error.message || "Erro ao publicar cardápio");
    } finally {
        isSubmitting = false;
        showLoading(false);
    }
}

// Verificação do token
async function verificarToken() {
    const token = localStorage.getItem("auth_token");
    if (!token) {
        window.location.href = "./login.html";
        return;
    }

    try {
        const response = await fetch(`${webservice}/dados`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
            localStorage.removeItem('auth_token');
            window.location.href = "./login.html";
            return;
        }

        const data = await response.json();
        if (!data.dono) {
            alert("Apenas donos de restaurante podem publicar cardápios");
            window.location.href = "./index.html";
        }
    } catch (err) {
        console.error("Erro ao verificar token:", err);
        window.location.href = "./login.html";
    }
}

// Event Listeners
document.addEventListener('DOMContentLoaded', function() {
    verificarToken();
    
    document.getElementById('postar_btn').addEventListener('click', function(e) {
        e.preventDefault();
        enviarPostCompleto();
    });
});
    </script>
</body>
</html>
