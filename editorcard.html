<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor de Cardápio</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Header carrega dinamicamente e ocupa largura total -->
  <div id="header-container"></div>

  <!-- Wrapper para centralizar só o conteúdo do editor -->
  <div class="wrapper">
    <div id="editorContainer">
      <div class="controls">
        <button class="modern-button" onclick="addText()">
          <i class="fas fa-font button-icon"></i>
          <span class="button-text">Texto</span>
        </button>

        <label for="imageUpload" class="modern-button">
          <i class="fas fa-image button-icon"></i>
          <span class="button-text">Imagem</span>
        </label>
        <input type="file" id="imageUpload" accept="image/*" onchange="addImage(event)" />

        <button class="modern-button" onclick="bringToFront()">
          <i class="fas fa-arrow-up button-icon"></i>
          <span class="button-text">Frente</span>
        </button>

        <button class="modern-button" onclick="sendToBack()">
          <i class="fas fa-arrow-down button-icon"></i>
          <span class="button-text">Trás</span>
        </button>

        <button class="modern-button" onclick="deleteSelected()">
          <i class="fas fa-trash button-icon"></i>
          <span class="button-text">Deletar</span>
        </button>

        <button class="modern-button" onclick="exportToPDF()">
          <i class="fas fa-file-pdf button-icon"></i>
          <span class="button-text">PDF</span>
        </button>

        <button class="modern-button" onclick="setBackgroundImage()">
          <i class="fas fa-fill-drip button-icon"></i>
          <span class="button-text">Fundo</span>
        </button>
      </div>

      <div class="text-options">
        <select id="fontFamily">
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Courier New">Courier New</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>

        <input type="number" id="fontSize" value="20" min="10" max="100" />
        <input type="color" id="fontColor" value="#000000" />
        <select id="fontStyle">
          <option value="normal">Normal</option>
          <option value="bold">Negrito</option>
          <option value="italic">Itálico</option>
        </select>
      </div>

      <canvas id="editorCanvas" width="794" height="1123"></canvas>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/script.js"></script>
  <script src="js/cabecalho.js"></script>
  <script src="js/server_script.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    lucide.createIcons();

    fetch('cabecalho.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        if (typeof initCabecalho === 'function') initCabecalho();
      });

    const canvas = document.getElementById("editorCanvas");
    const ctx = canvas.getContext("2d");

    let elements = [];
    let selected = null;
    let isResizing = false;

    let backgroundColor = "#ffffff";
    let backgroundImage = null;

    canvas.addEventListener("mousedown", e => {
      const x = e.offsetX, y = e.offsetY;
      selected = elements.findLast(el => isInside(el, x, y));

      if (selected) {
        if (selected.type === "image" && isOnResizeHandle(selected, x, y)) {
          isResizing = true;
        } else {
          isResizing = false;
          selected.offsetX = x - selected.x;
          selected.offsetY = y - selected.y;
        }
      }
    });

    canvas.addEventListener("mousemove", e => {
      if (!selected) return;
      const x = e.offsetX;
      const y = e.offsetY;

      if (isResizing && selected.type === "image") {
        selected.width = Math.max(20, x - selected.x);
        selected.height = Math.max(20, y - selected.y);
        render();
        return;
      }

      if (!isResizing) {
        selected.x = x - selected.offsetX;
        selected.y = y - selected.offsetY;
        render();
      }
    });

    canvas.addEventListener("mouseup", () => {
      isResizing = false;
      selected = null;
    });

    canvas.addEventListener("dblclick", () => {
      if (selected?.type === "text") {
        const newText = prompt("Editar texto:", selected.text);
        if (newText !== null) {
          selected.text = newText;
          render();
        }
      }
    });

    function isInside(el, x, y) {
      if (el.type === "text") {
        ctx.font = `${el.style} ${el.size}px ${el.font}`;
        const width = ctx.measureText(el.text).width;
        const height = el.size;
        return x >= el.x && x <= el.x + width && y >= el.y - height && y <= el.y;
      }
      if (el.type === "image") {
        return x >= el.x && x <= el.x + el.width && y >= el.y && y <= el.y + el.height;
      }
      return false;
    }

    function isOnResizeHandle(el, x, y) {
      const handleSize = 16;
      return (
        x >= el.x + el.width - handleSize &&
        x <= el.x + el.width + handleSize &&
        y >= el.y + el.height - handleSize &&
        y <= el.y + el.height + handleSize
      );
    }

    function addText() {
      const text = prompt("Digite o texto:");
      if (!text) return;
      const font = document.getElementById("fontFamily").value;
      const size = parseInt(document.getElementById("fontSize").value);
      const color = document.getElementById("fontColor").value;
      const style = document.getElementById("fontStyle").value;

      elements.push({
        type: "text",
        text,
        font,
        size,
        color,
        style,
        x: 50,
        y: 50
      });
      render();
    }

    function addImage(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function (evt) {
        const img = new Image();
        img.onload = function () {
          elements.push({
            type: "image",
            image: img,
            x: 50,
            y: 100,
            width: img.width * 0.3,
            height: img.height * 0.3
          });
          render();
        };
        img.src = evt.target.result;
      };
      if (file) reader.readAsDataURL(file);
    }

    function setBackgroundImage() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.onchange = (event) => {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            backgroundImage = img;
            render();
          };
          img.src = e.target.result;
        };
        if (file) reader.readAsDataURL(file);
      };
      input.click();
    }

    function changeBackgroundColor() {
      backgroundColor = document.getElementById("bgColorPicker").value;
      backgroundImage = null;
      render();
    }

    function render() {
      if (backgroundImage) {
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = backgroundColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      for (let el of elements) {
        if (el.type === "text") {
          ctx.font = `${el.style} ${el.size}px ${el.font}`;
          ctx.fillStyle = el.color;
          ctx.fillText(el.text, el.x, el.y);
        } else if (el.type === "image") {
          ctx.drawImage(el.image, el.x, el.y, el.width, el.height);

          if (selected === el) {
            ctx.strokeStyle = "blue";
            ctx.lineWidth = 2;
            ctx.strokeRect(el.x, el.y, el.width, el.height);

            ctx.fillStyle = "blue";
            ctx.fillRect(el.x + el.width - 8, el.y + el.height - 8, 16, 16);
          }
        }
      }
    }

    function bringToFront() {
      if (!selected) return;
      elements = elements.filter(el => el !== selected);
      elements.push(selected);
      render();
    }

    function sendToBack() {
      if (!selected) return;
      elements = elements.filter(el => el !== selected);
      elements.unshift(selected);
      render();
    }

    function deleteSelected() {
      if (!selected) return;
      elements = elements.filter(el => el !== selected);
      selected = null;
      render();
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "pt", "a4");
      const dataUrl = canvas.toDataURL("image/png");
      pdf.addImage(dataUrl, "PNG", 0, 0, 595, 842);
      pdf.save("cardapio.pdf");
    }

    function saveProject() {
      const data = {
        backgroundColor,
        backgroundImage: backgroundImage ? backgroundImage.src : null,
        elements: elements.map(el => {
          if (el.type === "image") return {
            type: "image",
            x: el.x, y: el.y, width: el.width, height: el.height,
            src: el.image.src
          };
          return el;
        })
      };
      localStorage.setItem("menuProject", JSON.stringify(data));
      alert("Projeto salvo!");
    }

    function loadProject() {
      const saved = localStorage.getItem("menuProject");
      if (!saved) return alert("Nenhum projeto salvo encontrado.");
      const data = JSON.parse(saved);

      backgroundColor = data.backgroundColor || "#ffffff";
      if (data.backgroundImage) {
        const img = new Image();
        img.onload = () => {
          backgroundImage = img;
          render();
        };
        img.src = data.backgroundImage;
      } else {
        backgroundImage = null;
      }

      elements = [];
      data.elements.forEach(el => {
        if (el.type === "text") {
          elements.push(el);
        } else if (el.type === "image") {
          const img = new Image();
          img.onload = () => {
            elements.push({ ...el, image: img });
            render();
          };
          img.src = el.src;
        }
      });

      render();
    }
  </script>
</body>
</html>
