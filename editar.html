<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cardápio</title>
    <link rel="stylesheet" href="editar.css" />
    <style>
        /* Adicione os mesmos estilos do publicar.css */
    </style>
</head>
<body>
    <!-- Adicione a estrutura HTML completa aqui -->
    <div class="container">
        <input type="text" id="title" placeholder="Título">
        <textarea id="content" placeholder="Conteúdo"></textarea>
        <input type="text" id="linksocial" placeholder="Link Social">
        <div class="radio-group">
            <input type="radio" id="public" name="visibility" value="public">
            <label for="public">Público</label>
            <input type="radio" id="private" name="visibility" value="private">
            <label for="private">Privado</label>
        </div>
        <div id="upload-area">
            <img id="preview" style="display: none;">
            <span id="upload-text">Upload de imagem</span>
        </div>
        <button onclick="salvarEdicao()">Salvar</button>
    </div>

    <script>
        const webservice = "https://imenu-backend-pd3a.onrender.com";
        
async function carregarPost() {
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    if (!postId || postId === 'undefined') {
        alert('Post não encontrado: ID inválido');
        window.location.href = 'index.html';
        return;
    }
    try {
        await registrarVisualizacao(postId);
        const [postResponse, viewsResponse] = await Promise.all([
            fetch(`${beleza}/posts/${postId}`),
            fetch(`${beleza}/posts/${postId}/views`)
        ]);
        const post = await postResponse.json();
        const viewsData = await viewsResponse.json();

        document.getElementById('post-title').textContent = post.title || 'Sem título';
        document.getElementById('post-content').textContent = post.content || 'Sem conteúdo';
        document.getElementById('post-author').textContent = `Por: ${post.author?.name || 'Anônimo'}`;
        document.getElementById('post-views').textContent = `${viewsData.views || 0} visualizações`;

        const postImage = document.getElementById('post-image');
        if (post.capa) {
            postImage.style.backgroundImage = `url('${post.capa}')`;
            postImage.style.backgroundSize = 'cover';
            postImage.style.backgroundPosition = 'center';
            postImage.style.height = '300px';
            postImage.style.cursor = 'pointer';
            
            // Verifica se tem arquivo e se é PDF ou imagem
            if (post.arquivo) {
                const isPDF = post.arquivo.toLowerCase().endsWith('.pdf') || post.arquivo.includes('fl_attachment');
                if (isPDF) {
                    // Se for PDF, baixa o PDF ao clicar
                    postImage.onclick = () => abrirArquivo();
                    postImage.title = 'Clique para baixar o cardápio (PDF)';
                } else {
                    // Se for imagem, abre a imagem do arquivo em modal
                    postImage.onclick = () => abrirImagemCapa(post.arquivo);
                    postImage.title = 'Clique para ver o cardápio (Imagem)';
                }
            } else {
                // Se não tem arquivo mas tem capa, abre a capa em modal
                postImage.onclick = () => abrirImagemCapa(post.capa);
                postImage.title = 'Clique para ver a imagem em tela cheia';
            }
        } else if (post.arquivo) {
            // Se não tem capa mas tem arquivo (imagem)
            const isPDF = post.arquivo.toLowerCase().endsWith('.pdf') || post.arquivo.includes('fl_attachment');
            if (!isPDF) {
                // Mostra a imagem do arquivo como imagem principal
                postImage.style.backgroundImage = `url('${post.arquivo}')`;
                postImage.style.backgroundSize = 'cover';
                postImage.style.backgroundPosition = 'center';
                postImage.style.height = '300px';
                postImage.style.cursor = 'pointer';
                postImage.onclick = () => abrirImagemCapa(post.arquivo);
                postImage.title = 'Clique para ver o cardápio (Imagem)';
            } else {
                // Se for PDF sem capa, mostra um placeholder
                postImage.style.backgroundImage = 'url("https://cdn-icons-png.flaticon.com/512/337/337946.png")';
                postImage.style.backgroundSize = 'contain';
                postImage.style.backgroundColor = '#f0f0f0';
                postImage.style.height = '300px';
                postImage.style.cursor = 'pointer';
                postImage.onclick = () => abrirArquivo();
                postImage.title = 'Clique para baixar o cardápio (PDF)';
            }
        } else {
            postImage.style.display = 'none';
        }

        // Restante do código permanece o mesmo...
        const profileBtn = document.getElementById('view-profile-btn');
        if (post.author) {
            profileBtn.style.display = 'block';
            profileBtn.onclick = () => {
                const token = localStorage.getItem("auth_token");
                if (token) {
                    window.location.href = `perfil.html?userId=${post.authorId}`;
                } else {
                    alert("Você precisa estar logado para ver perfis de usuários");
                    window.location.href = "login.html";
                }
            };
        } else {
            profileBtn.style.display = 'none';
        }

        await carregarMedia(postId);
        ativarAvaliacao(postId);
        await carregarComentarios(postId);
    } catch (error) {
        console.error('Erro ao carregar post:', error);
        alert(`Erro ao carregar post: ${error.message}`);
        setTimeout(() => window.location.href = 'index.html', 2000);
    }
}
        
    async function salvarEdicao() {
        const params = new URLSearchParams(window.location.search);
        const postId = params.get("id");
        
        if (!postId) {
            alert("Post não encontrado");
            window.location.href = "perfil.html";
            return;
        }

        // Obter os valores dos campos
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;
        const sociallink = document.getElementById("linksocial").value;
        const isPublic = document.getElementById("public").checked;
        const previewElement = document.getElementById("preview");
        const capa = previewElement.style.display !== 'none' ? previewElement.src : null;

        if (!title || !content) {
            alert("Título e conteúdo são obrigatórios!");
            return;
        }

        try {
            // Obter o token JWT do localStorage ou de onde você o armazena
            const token = localStorage.getItem('auth_token'); // Ajuste conforme sua aplicação
            
            if (!token) {
                alert("Sessão expirada. Faça login novamente.");
                window.location.href = "login.html";
                return;
            }

            const response = await fetch(`${webservice}/posts/${postId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    title,
                    content,
                    sociallink,
                    public: isPublic,
                    capa
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || "Erro ao atualizar post");
            }

            alert("Post atualizado com sucesso!");
            window.location.href = "perfil.html";
        } catch (err) {
            console.error("Erro ao salvar edição:", err);
            alert("Erro ao salvar edição: " + err.message);
        }
    }

    document.addEventListener('DOMContentLoaded', carregarPost);
    </script>
</body>
</html>
