<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cardápio</title>
    <link rel="stylesheet" href="editar.css" />
    <style>
        /* Estilos básicos para a página de edição */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        textarea {
            min-height: 200px;
        }
        button {
            background-color: #3B1D0F;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        #upload-area {
            border: 2px dashed #ddd;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
        }
        #preview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin-bottom: 15px;
        }
        .radio-group {
            margin-bottom: 15px;
        }
        
        /* Estilos para as tags */
        .tags-container {
            margin: 20px 0;
        }
        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tag-item {
            background-color: #E0C097;
            color: #4E342E;
            padding: 5px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        .tag-item button {
            background: none;
            border: none;
            color: #D32F2F;
            margin-left: 5px;
            padding: 0;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .add-tag-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .add-tag-container select {
            flex: 1;
        }
        .add-tag-container button {
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editar Cardápio</h1>
        <input type="text" id="title" placeholder="Título">
        <textarea id="content" placeholder="Conteúdo"></textarea>
        <input type="text" id="linksocial" placeholder="Link Social">
        
        <div class="radio-group">
            <input type="radio" id="public" name="visibility" value="public">
            <label for="public">Público</label>
            <input type="radio" id="private" name="visibility" value="private">
            <label for="private">Privado</label>
        </div>
        
        <!-- Seção de Tags -->
        <div class="tags-container">
            <h3>Tags do Cardápio</h3>
            <div class="tags-list" id="tags-list">
                <!-- Tags serão adicionadas dinamicamente aqui -->
            </div>
            
            <div class="add-tag-container">
                <select id="available-tags">
                    <option value="">Selecione uma tag para adicionar</option>
                    <!-- Tags disponíveis serão carregadas aqui -->
                </select>
                <button onclick="adicionarTag()">Adicionar Tag</button>
            </div>
        </div>
        
        <div id="upload-area">
            <img id="preview" style="display: none;">
            <span id="upload-text">Upload de imagem</span>
        </div>
        
        <button onclick="salvarEdicao()">Salvar Alterações</button>
        <button onclick="window.history.back()">Cancelar</button>
    </div>

    <script>
        const webservice = "https://imenu-backend-pd3a.onrender.com";
        let currentPostId = null;
        let currentCapaUrl = null;
        let currentTags = []; // Armazenará as tags atuais do post
        let availableTags = []; // Armazenará todas as tags disponíveis

        // Função para carregar os dados do post a ser editado
        async function carregarPostParaEdicao() {
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');
            
            if (!currentPostId) {
                alert('Post não encontrado: ID inválido');
                window.location.href = 'perfil.html';
                return;
            }

            try {
                const token = localStorage.getItem('auth_token');
                if (!token) {
                    alert('Você precisa estar logado para editar posts');
                    window.location.href = 'login.html';
                    return;
                }

                // Carrega o post e suas tags
                const response = await fetch(`${webservice}/posts/${currentPostId}?include=tags`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Erro ao carregar post');
                }

                const post = await response.json();

                // Preencher os campos com os dados do post
                document.getElementById('title').value = post.title || '';
                document.getElementById('content').value = post.content || '';
                document.getElementById('linksocial').value = post.sociallink || '';
                
                // Definir a opção de visibilidade
                if (post.public) {
                    document.getElementById('public').checked = true;
                } else {
                    document.getElementById('private').checked = true;
                }

                // Mostrar a imagem de capa se existir
                if (post.capa) {
                    currentCapaUrl = post.capa;
                    const preview = document.getElementById('preview');
                    preview.src = post.capa;
                    preview.style.display = 'block';
                    document.getElementById('upload-text').style.display = 'none';
                }

                // Carregar tags do post
                if (post.tags && post.tags.length > 0) {
                    currentTags = post.tags;
                    atualizarListaDeTags();
                }

                // Carregar todas as tags disponíveis
                await carregarTagsDisponiveis();

            } catch (error) {
                console.error('Erro ao carregar post:', error);
                alert(`Erro ao carregar post: ${error.message}`);
                window.location.href = 'perfil.html';
            }
        }

        // Função para carregar todas as tags disponíveis
        async function carregarTagsDisponiveis() {
            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${webservice}/tags`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Erro ao carregar tags');
                }

                availableTags = await response.json();
                preencherSelectDeTags();
            } catch (error) {
                console.error('Erro ao carregar tags:', error);
                alert(`Erro ao carregar tags disponíveis: ${error.message}`);
            }
        }

        // Função para preencher o select com as tags disponíveis
        function preencherSelectDeTags() {
            const select = document.getElementById('available-tags');
            select.innerHTML = '<option value="">Selecione uma tag para adicionar</option>';
            
            // Filtra tags que ainda não foram adicionadas ao post
            const tagsNaoAdicionadas = availableTags.filter(tag => 
                !currentTags.some(t => t.id === tag.id)
            );
            
            tagsNaoAdicionadas.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag.id;
                option.textContent = tag.name;
                select.appendChild(option);
            });
        }

        // Função para atualizar a lista de tags exibidas
        function atualizarListaDeTags() {
            const tagsList = document.getElementById('tags-list');
            tagsList.innerHTML = '';
            
            currentTags.forEach(tag => {
                const tagElement = document.createElement('div');
                tagElement.className = 'tag-item';
                tagElement.innerHTML = `
                    ${tag.name}
                    <button onclick="removerTag(${tag.id})">×</button>
                `;
                tagsList.appendChild(tagElement);
            });
            
            // Atualiza o select com as tags disponíveis
            preencherSelectDeTags();
        }

        // Função para adicionar uma tag ao post
        function adicionarTag() {
            const select = document.getElementById('available-tags');
            const tagId = select.value;
            
            if (!tagId) {
                alert('Selecione uma tag para adicionar');
                return;
            }
            
            // Encontra a tag selecionada na lista de tags disponíveis
            const tagParaAdicionar = availableTags.find(tag => tag.id == tagId);
            
            if (tagParaAdicionar && !currentTags.some(t => t.id == tagId)) {
                currentTags.push(tagParaAdicionar);
                atualizarListaDeTags();
                select.value = '';
            }
        }

        // Função para remover uma tag do post
        function removerTag(tagId) {
            currentTags = currentTags.filter(tag => tag.id != tagId);
            atualizarListaDeTags();
        }

        // Função para lidar com o upload de imagem
        document.getElementById('upload-area').addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > 10 * 1024 * 1024) { // 10MB
                    alert('O arquivo deve ter no máximo 10MB');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('preview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    document.getElementById('upload-text').style.display = 'none';
                    
                    // Aqui você pode adicionar lógica para enviar a imagem para o servidor
                    // e atualizar currentCapaUrl com a nova URL
                };
                reader.readAsDataURL(file);
            };
            
            input.click();
        });

        // Função para salvar as alterações
async function salvarEdicao() {
    if (!currentPostId) {
        alert('Post não identificado');
        return;
    }

    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const sociallink = document.getElementById('linksocial').value.trim();
    const isPublic = document.getElementById('public').checked;
    
    if (!title || !content) {
        alert('Título e conteúdo são obrigatórios');
        return;
    }

    try {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            alert('Sessão expirada. Faça login novamente.');
            window.location.href = 'login.html';
            return;
        }

        // Garantir que os IDs das tags são números
        const tagIds = currentTags.map(tag => parseInt(tag.id)).filter(id => !isNaN(id));

        const postData = {
            title,
            content,
            sociallink: sociallink || null,
            public: isPublic,
            capa: currentCapaUrl,
            tags: tagIds
        };

        console.log('Enviando dados:', postData); // Para debug

        const response = await fetch(`${webservice}/posts/${currentPostId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(postData)
        });

        const responseData = await response.json(); // Sempre tentar ler a resposta JSON
        
        if (!response.ok) {
            throw new Error(responseData.error || 'Erro ao atualizar post');
        }

        alert('Post atualizado com sucesso!');
        window.location.href = 'perfil.html';

    } catch (error) {
        console.error('Erro ao salvar edição:', error);
        alert(`Erro ao salvar edição: ${error.message}`);
    }
} 

// Carregar o post quando a página for aberta
        document.addEventListener('DOMContentLoaded', carregarPostParaEdicao);
    </script>
</body>
</html>
