<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro de Verificação</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #3B1F16;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 14px;
    }
    .logo .circle {
      width: 12px;
      height: 12px;
      background-color: #FFFFFF;
      border-radius: 50%;
    }
    .message {
      font-size: 36px;
      font-weight: bold;
      max-width: 90%;
    }
    .description {
      font-size: 20px;
      max-width: 90%;
    }
    .email-icon img {
      width: 250px;
      max-width: 100%;
      height: auto;
    }
    .stars {
      position: absolute;
    }
    .star-top {
      top: 5%;
      right: 5%;
      width: 100px;
    }
    .star-bottom {
      bottom: 5%;
      left: 5%;
      width: 100px;
    }
    .stars img {
      width: 100%;
      height: auto;
    }

    /* Responsividade */
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        text-align: left;
        align-items: center;
        justify-content: space-between;
      }
      .text-section {
        max-width: 60%;
      }
      .email-icon img {
        width: 300px;
      }
      .message {
        font-size: 40px;
      }
      .description {
        font-size: 22px;
      }
      .star-top {
        top: 10%;
        right: 10%;
        width: 120px;
      }
      .star-bottom {
        bottom: 10%;
        left: 10%;
        width: 120px;
      }
    }

    @media (max-width: 480px) {
      .message {
        font-size: 28px;
      }
      .description {
        font-size: 18px;
      }
      .email-icon img {
        width: 200px;
      }
      .star-top, .star-bottom {
        display: none; /* Esconde as estrelas em telas pequenas */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-section">
      <div class="logo">
        <div class="circle"></div>
        <span>IMENU CORP</span>
      </div>
      <div class="message">Não foi possível verificar seu email...</div>
      <div class="description">Lamentamos, mas algo deu errado na verificação, tente novamente.</div>
    </div>
    <div class="email-icon">
      <img src="images/carta.png" alt="Ícone de envelope">
    </div>
  </div>
  <div class="stars star-top">
    <img src="images/estrela.png" alt="Ícone de estrela">
  </div>
  <div class="stars star-bottom">
    <img src="images/estrela.png" alt="Ícone de estrela">
  </div>
</body>
</html>
