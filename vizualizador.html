<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Post - iMenu</title>
  <link rel="stylesheet" href="vizu.css">
</head>
<body>
  <div id="header-container"></div>

  <main class="post-container">
    <div class="post-card">
      <div class="post-header">
        <h1 id="post-title">none</h1>
        <p class="post-author" id="post-author"></p>
        <p class="post-views" id="post-views">0 visualizações</p>
        <button id="view-profile-btn" class="profile-btn">Ver Perfil</button>
      </div>

      <div class="post-image" id="post-image"></div>

      <p id="media-avaliacao">Carregando média...</p>
      <div class="rating">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>

      <div class="post-content">
        <p id="post-content"></p>
        <a href="#" id="post-link" class="social-link">Ver rede social</a>
      </div>

      <button onclick="window.history.back()" class="btn">← Voltar</button>

      <section class="comments-section">
        <h2>Comentários</h2>
        <div class="comment-form" id="comment-form">
          <textarea id="comment-content" placeholder="Adicione um comentário..." rows="3"></textarea>
          <button onclick="postComment()" class="btn">Enviar Comentário</button>
        </div>
        <div class="comments-list" id="comments-list"></div>
      </section>
    </div>
  
  </main>

  <div id="footer-container"></div>


  <script src="js/script.js"></script>
  <script src="js/cabecalho.js"></script>
  <script src="js/server_script.js"></script>

  <!-- Carrega o Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>

  <script>
    //mudei pra nao dar erro sla (pergunta pra mim antes de mudar algo aqui)
    const beleza = "https://imenu-backend-pd3a.onrender.com";

    // Agora que o DOM está pronto e o Lucide foi carregado
    lucide.createIcons();


    fetch('cabecalho.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        if (typeof initCabecalho === 'function') initCabecalho();
      });

      fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-container').innerHTML = data;
    });

    function parseJwt(token) {
      try {
        return JSON.parse(atob(token.split('.')[1]));
      } catch (e) {
        return null;
      }
    }

    async function downloadFile(pdfUrl) {
    try {
        // Adiciona cabeçalho para forçar download
        const response = await fetch(pdfUrl, {
            headers: {
                'Content-Disposition': 'attachment'
            }
        });
        
        if (!response.ok) {
            throw new Error('Erro ao baixar arquivo');
        }

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = blobUrl;
        link.setAttribute('download', 'cardapio.pdf');
        document.body.appendChild(link);
        link.click();
        
        // Limpeza
        setTimeout(() => {
            document.body.removeChild(link);
            window.URL.revokeObjectURL(blobUrl);
        }, 100);
    } catch (err) {
        console.error('Erro no download:', err);
        alert('Erro ao baixar o arquivo. Tente novamente.');
    }
}

    async function abrirImagemCapa(imageUrl) {
    // Cria o modal principal
    const modal = document.createElement('div');
    modal.id = 'image-modal';
    modal.style.position = 'fixed';
    modal.style.top = '0';
    modal.style.left = '0';
    modal.style.width = '100%';
    modal.style.height = '100%';
    modal.style.backgroundColor = 'rgba(0,0,0,0.9)';
    modal.style.display = 'flex';
    modal.style.justifyContent = 'center';
    modal.style.alignItems = 'center';
    modal.style.zIndex = '1000';
    modal.style.cursor = 'zoom-out';
    
    // Container da imagem com overflow
    const imgContainer = document.createElement('div');
    imgContainer.style.position = 'relative';
    imgContainer.style.width = '90%';
    imgContainer.style.height = '90%';
    imgContainer.style.overflow = 'hidden';
    imgContainer.style.display = 'flex';
    imgContainer.style.justifyContent = 'center';
    imgContainer.style.alignItems = 'center';
    
    // Elemento da imagem
    const img = document.createElement('img');
    img.id = 'modal-image';
    img.src = imageUrl;
    img.style.maxWidth = '100%';
    img.style.maxHeight = '100%';
    img.style.objectFit = 'contain';
    img.style.transition = 'transform 0.3s ease';
    img.style.cursor = 'zoom-in';
    
    // Botão de fechar
    const closeBtn = document.createElement('button');
    closeBtn.innerHTML = '&times;';
    closeBtn.style.position = 'absolute';
    closeBtn.style.top = '15px';
    closeBtn.style.right = '15px';
    closeBtn.style.background = 'none';
    closeBtn.style.border = 'none';
    closeBtn.style.color = 'white';
    closeBtn.style.fontSize = '30px';
    closeBtn.style.cursor = 'pointer';
    closeBtn.style.zIndex = '1001';
    
    // Botão de download
    const downloadBtn = document.createElement('button');
    downloadBtn.innerHTML = '⬇️';
    downloadBtn.style.position = 'absolute';
    downloadBtn.style.top = '15px';
    downloadBtn.style.left = '15px';
    downloadBtn.style.background = 'rgba(0,0,0,0.5)';
    downloadBtn.style.border = 'none';
    downloadBtn.style.borderRadius = '50%';
    downloadBtn.style.color = 'white';
    downloadBtn.style.fontSize = '20px';
    downloadBtn.style.width = '40px';
    downloadBtn.style.height = '40px';
    downloadBtn.style.cursor = 'pointer';
    downloadBtn.style.zIndex = '1001';
    
    // Variáveis para controle do zoom
    let scale = 1;
    let isDragging = false;
    let startPos = { x: 0, y: 0 };
    let translate = { x: 0, y: 0 };
    
    // Função para aplicar transformação
    function applyTransform() {
        img.style.transform = `translate(${translate.x}px, ${translate.y}px) scale(${scale})`;
    }
    
    // Eventos de zoom
    img.addEventListener('click', (e) => {
        e.stopPropagation();
        scale = scale === 1 ? 2 : 1;
        translate = { x: 0, y: 0 }; // Reset position when toggling zoom
        applyTransform();
        modal.style.cursor = scale === 1 ? 'zoom-out' : 'zoom-in';
    });
    
    // Eventos de arrastar (para quando estiver com zoom)
    img.addEventListener('mousedown', (e) => {
        if (scale > 1) {
            isDragging = true;
            startPos = { x: e.clientX - translate.x, y: e.clientY - translate.y };
            img.style.cursor = 'grabbing';
        }
    });
    
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translate.x = e.clientX - startPos.x;
        translate.y = e.clientY - startPos.y;
        applyTransform();
    });
    
    window.addEventListener('mouseup', () => {
        isDragging = false;
        if (scale > 1) {
            img.style.cursor = 'grab';
        }
    });
    
    // Evento de download
    downloadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const link = document.createElement('a');
        link.href = imageUrl;
        link.download = 'cardapio.jpg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
    
    // Fecha o modal ao clicar fora
    modal.addEventListener('click', () => {
        document.body.removeChild(modal);
    });
    
    // Monta a estrutura
    imgContainer.appendChild(img);
    imgContainer.appendChild(closeBtn);
    imgContainer.appendChild(downloadBtn);
    modal.appendChild(imgContainer);
    document.body.appendChild(modal);
    
    // Fecha com ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.body.removeChild(modal);
        }
    });
}

async function abrirArquivo() {
    const postId = new URLSearchParams(window.location.search).get('id');
    if (!postId) return alert('Post não encontrado');
    
    try {
        const response = await fetch(`${beleza}/posts/${postId}`);
        const post = await response.json();
        
        if (!post.arquivo) return alert('Nenhum arquivo encontrado');
        
        // Verifica se é PDF ou imagem
        const isPDF = post.arquivo.toLowerCase().endsWith('.pdf') || 
                     post.arquivo.includes('fl_attachment') || 
                     post.arquivo.includes('application/pdf');
        
        if (isPDF) {
            // Se for PDF, força o download
            const downloadUrl = post.arquivo.includes('fl_attachment') 
                ? post.arquivo 
                : post.arquivo + (post.arquivo.includes('?') ? '&' : '?') + 'fl_attachment';
            await downloadFile(downloadUrl);
        } else {
            // Se for imagem, abre em modal para visualização
            abrirImagemCapa(post.arquivo);
        }
    } catch (error) {
        console.error('Erro ao abrir arquivo:', error);
        alert('Erro ao abrir o arquivo');
    }
}
    async function registrarVisualizacao(postId) {
      try {
        await fetch(`${beleza}/posts/${postId}/view`, { method: 'POST' });
      } catch (error) {
        console.error('Erro ao registrar visualização:', error);
      }
    }

    async function carregarPost() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');
      if (!postId || postId === 'undefined') {
        alert('Post não encontrado: ID inválido');
        window.location.href = 'index.html';
        return;
      }
      try {
        await registrarVisualizacao(postId);
        const [postResponse, viewsResponse] = await Promise.all([
          fetch(`${beleza}/posts/${postId}`),
          fetch(`${beleza}/posts/${postId}/views`)
        ]);
        const post = await postResponse.json();
        const viewsData = await viewsResponse.json();

        document.getElementById('post-title').textContent = post.title || 'Sem título';
        document.getElementById('post-content').textContent = post.content || 'Sem conteúdo';
        document.getElementById('post-author').textContent = `Por: ${post.author?.name || 'Anônimo'}`;
        document.getElementById('post-views').textContent = `${viewsData.views || 0} visualizações`;

        const postImage = document.getElementById('post-image');
// Modificação principal aqui:
if (post.capa) {
  postImage.style.backgroundImage = `url('${post.capa}')`;
  postImage.style.backgroundSize = 'cover';
  postImage.style.backgroundPosition = 'center';
  postImage.style.height = '300px';
  postImage.style.cursor = 'pointer';
  
  // Corrigindo a lógica de clique:
  if (post.arquivo) {
    // Sempre abre o arquivo (PDF ou imagem) ao clicar na capa
    postImage.onclick = () => abrirArquivo();
    postImage.title = 'Clique para ver o cardápio';
  } else {
    // Se não tem arquivo, mas tem capa, abre a imagem em tela cheia
    postImage.onclick = () => abrirImagemCapa(post.capa);
    postImage.title = 'Clique para ampliar a imagem';
  }
} else {
  postImage.style.display = 'none';
}

        const profileBtn = document.getElementById('view-profile-btn');
        if (post.author) {
          profileBtn.style.display = 'block';
          profileBtn.onclick = () => {
            const token = localStorage.getItem("auth_token");
            if (token) {
              window.location.href = `perfil.html?userId=${post.authorId}`;
            } else {
              alert("Você precisa estar logado para ver perfis de usuários");
              window.location.href = "login.html";
            }
          };
        } else {
          profileBtn.style.display = 'none';
        }

        await carregarMedia(postId);
        ativarAvaliacao(postId);
        await carregarComentarios(postId);
      } catch (error) {
        console.error('Erro ao carregar post:', error);
        alert(`Erro ao carregar post: ${error.message}`);
        setTimeout(() => window.location.href = 'index.html', 2000);
      }
    }

    async function carregarMedia(postId) {
      try {
        const res = await fetch(`${beleza}/avaliacoes/media/${postId}`);
        const data = await res.json();
        if (data && typeof data.media !== 'undefined') {
          const media = parseFloat(data.media).toFixed(1);
          document.getElementById("media-avaliacao").innerText = `Média de avaliação: ${media} ★`;
          const stars = document.querySelectorAll('.star');
          const roundedMedia = Math.round(data.media);
          stars.forEach((star, index) => {
            star.classList.toggle('selected', index < roundedMedia);
          });
        } else {
          document.getElementById("media-avaliacao").innerText = "Sem avaliações ainda";
        }
      } catch (err) {
        document.getElementById("media-avaliacao").innerText = "Erro ao carregar avaliações";
      }
    }

    function ativarAvaliacao(postId) {
      const stars = document.querySelectorAll('.star');
      let selectedRating = 0;
      stars.forEach(star => {
        star.addEventListener('mouseover', () => highlightStars(+star.dataset.value));
        star.addEventListener('mouseout', () => highlightStars(selectedRating));
        star.addEventListener('click', async () => {
          selectedRating = +star.dataset.value;
          highlightStars(selectedRating);
          await salvarAvaliacao(postId, selectedRating);
          await carregarMedia(postId);
        });
      });

      function highlightStars(rating) {
        stars.forEach(star => {
          const val = +star.dataset.value;
          star.classList.toggle('hover', val <= rating);
          star.classList.toggle('selected', val <= rating);
        });
      }
    }

    async function salvarAvaliacao(postId, nota) {
      const token = localStorage.getItem("auth_token");
      if (!token) return alert("Você precisa estar logado para avaliar.");
      try {
        const response = await fetch(`${beleza}/avaliar/${postId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ nota })
        });
        const data = await response.json();
        if (!response.ok) {
          alert("Erro ao salvar avaliação: " + (data.message || "Erro desconhecido"));
        }
      } catch (err) {
        alert("Erro ao salvar avaliação. Tente novamente.");
      }
    }

    async function carregarComentarios(postId) {
      try {
        const response = await fetch(`${beleza}/comentarios/${postId}`);
        const comments = await response.json();
        const commentsList = document.getElementById('comments-list');
        commentsList.innerHTML = '';
        const token = localStorage.getItem("auth_token");
        const userId = token ? parseJwt(token).id : null;

        comments.forEach(comment => {
          const commentDiv = document.createElement('div');
          commentDiv.className = 'comment';
          const commentDate = new Date(comment.createdAt).toLocaleString();
          commentDiv.innerHTML = `
            <div class="comment-header">
              <span class="comment-author">${comment.author.name}</span>
              <span class="comment-date">${commentDate}</span>
            </div>
            <p class="comment-content">${comment.content}</p>
            ${userId === comment.authorId ? `<button class="delete-comment" data-id="${comment.id}">Excluir</button>` : ''}
          `;
          commentsList.appendChild(commentDiv);
        });

        document.querySelectorAll('.delete-comment').forEach(button => {
          button.addEventListener('click', async (e) => {
            if (confirm('Tem certeza que deseja excluir este comentário?')) {
              await deletarComentario(e.target.dataset.id);
              await carregarComentarios(postId);
            }
          });
        });

        document.getElementById('comment-form').style.display = token ? 'block' : 'none';
      } catch (error) {
        document.getElementById('comments-list').innerHTML = '<p>Erro ao carregar comentários.</p>';
      }
    }

    async function postComment() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');
      const content = document.getElementById('comment-content').value.trim();
      const token = localStorage.getItem("auth_token");
      if (!content) return alert('Por favor, escreva um comentário.');
      if (!token) return alert('Você precisa estar logado para comentar.');
      try {
        await fetch(`${beleza}/comentar/${postId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ content })
        });
        document.getElementById('comment-content').value = '';
        await carregarComentarios(postId);
      } catch (error) {
        alert('Erro ao postar comentário.');
      }
    }

    async function deletarComentario(commentId) {
      const token = localStorage.getItem("auth_token");
      try {
        await fetch(`${beleza}/comentario-del/${commentId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch (error) {
        console.error('Erro ao deletar comentário:', error);
      }
    }

  window.addEventListener("load", async () => {
  await carregarPost();
});

  </script>

</body>
