<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil</title>
  <link rel="stylesheet" href="perfil.css"/>
</head>
<body class="bodyp">

  <!-- Cabeçalho -->
 <!-- Cabeçalho -->
<header class="headerperfil">
 <button class="icon-button" onclick="voltar()" aria-label="Voltar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M15 18L9 12L15 6" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
  <button class="icon-button" id="locationicon" onclick="localizacao()">
    📍 <!-- ícone de localização -->
  </button>
</header>

  <!-- Banner do restaurante -->
<div class="banner-perfil">
  <img src="images/background-cad.png" alt="Banner do restaurante" />
</div>


  <!-- Cartão de Perfil -->
  <section class="main-p">
    <div class="profile-card">

      <!-- Foto -->
      <div class="image">
        <img src="images/perfil.png" alt="Foto de perfil" class="profile-pic" id="profile-img"/>
      </div>

      <!-- Nome + estrelas -->
      <div class="data">
        <h2 class="h2P" id="P-username">None</h2>
        <div class="stars" id="stars">★★★★☆</div>
        <p id="tipo-conta">none</p>
      </div>

      <!-- Localização, Seguidores, Visitados -->
   <div class="rowP">
  <div class="info">
    <h3 id="localizacao">📍 --- / Brasil</h3>
  </div>
  <div class="info">
    <h3>Seguidores</h3>
    <span>--</span>
  </div>
  <div class="info">
    <h3>Visitados</h3>
    <span>--</span>
  </div>
</div>

  </section>

  <!-- Cardápios publicados -->
  <section class="section">
    <h4>Cardápios publicados</h4>
    <div id="cards_user">
    <div id="cards_user_info">
      
      <div class="image-item" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background-color: #e0e0e0;">+</div>
    </div>
  </section>
  <section class="section">
    <h4>Cardápios privados</h4>
    <div id="cards_user_p">
    <div id="cards_user_info_p">
      
      <div class="image-item" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background-color: #e0e0e0;">+</div>
    </div>
  </section>

  <!-- Comentários -->
  <section class="section">
    <h4>Comentarios (78) <span class="rating-small">★★★☆☆</span></h4>
    <!-- Você pode inserir a lista de comentários aqui -->
  </section>

  <!-- Scripts -->
  <script src="js/server_script.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
