<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil</title>
  <link rel="stylesheet" href="perfil.css"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- PDF libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bodyp">

<!-- Cabeçalho -->
<header class="headerperfil d-flex align-items-center justify-content-between px-3">
  <div class="d-flex align-items-center">
    <button class="icon-button me-2" onclick="voltar()" aria-label="Voltar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Botão de CONFIGURAÇÕES -->
  <button id="config-btn" onclick="window.location.href='configuracoes.html'" class="icon-button" aria-label="Configurações">
    <i data-lucide="settings"></i>
  </button>
</header>

<!-- Banner -->
<div class="banner-perfil">
  <img src="images/background-cad.png" alt="Banner do restaurante" />
</div>

<!-- Perfil -->
<section class="main-p">
  <div class="profile-card">
    <div class="image">
      <div class="profile-pic-wrapper">
        <img src="images/perfil.png" alt="Foto de perfil" class="profile-pic" id="profile-img"/>
      </div>
    </div>

    <div class="data">
      <h2 class="h2P" id="P-username">None</h2>
      <div class="stars" id="stars">★★★★☆</div>
      <p id="tipo-conta">none</p>

      <!-- BLOCO DE INFORMAÇÕES -->
      <div class="info-principal">
        <span id="localizacao">📍 --- / Brasil</span>
        <span id="telefone">📞 --</span>
      </div>

      <!-- NOVO BLOCO DE HORÁRIOS -->
      <div class="info-principal">
        <span id="horario-personalizado">⏰ --</span>
      </div>
    </div>

    <div class="rowP">
      <div class="info">
        <h3>Seguidores</h3>
        <span>--</span>
      </div>
      <div class="info">
        <h3>Visitados</h3>
        <span>--</span>
      </div>
    </div>
  </div>
</section>

<!-- Cardápios publicados -->
<section class="section">
  <h4>Cardápios publicados</h4>
  <div id="cards_user">
    <div id="cards_user_info">
      <div class="image-item" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background-color: #e0e0e0;">+</div>
    </div>
  </div>
</section>

<!-- Cardápios privados -->
<section class="section">
  <h4>Cardápios privados</h4>
  <div id="cards_user_p">
    <div id="cards_user_info_p">
      <div class="image-item" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background-color: #e0e0e0;">+</div>
    </div>
  </div>
</section>

<!-- Relatório de Visualizações (apenas donos) -->
<section class="section" id="relatorio" style="display: none; margin-top: 30px;">
  <h4>📊 Relatório de Visualizações</h4>
  <button onclick="gerarRelatorioPDF()" class="btn btn-primary">📄 Baixar PDF</button>
  <table id="tabela-relatorio" class="table table-bordered mt-2">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Visualizações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<!-- Comentários -->
<section class="section">
  <h4>Comentários (78) <span class="rating-small">★★★☆☆</span></h4>
</section>

<div id="footer-container"></div>

<!-- Scripts -->
<script src="js/server_script.js"></script>
<script src="js/script.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
lucide.createIcons();

fetch('footer.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('footer-container').innerHTML = data;
  });

window.webservice = window.webservice || "https://imenu-backend-pd3a.onrender.com";

function parseJwt(token) {
  try {
    return JSON.parse(atob(token.split('.')[1]));
  } catch (e) {
    return null;
  }
}

window.onload = async () => {
  await verificarToken();
  
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('userId');
  const token = localStorage.getItem("auth_token");
  const userData = parseJwt(token);
  
  const configBtn = document.getElementById("config-btn");
  if (!userId && configBtn) {
    configBtn.style.display = "inline-block";
  }
  
  if (userId) {
    await carregarPerfilRestaurante(userId);
    if (configBtn) configBtn.style.display = "none";
  } else {
    try {
      const response = await fetch(`${webservice}/dados`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      
      if (response.ok) {
        const userDataComplete = await response.json();
        
        const spanUser = document.getElementById("P-username");
        const spanTipo = document.getElementById("tipo-conta");
        const spanTel = document.getElementById("telefone");
        const spanLoc = document.getElementById("localizacao");
        const spanHorarios = document.getElementById("horario-personalizado");
        
        if (spanUser) {
          spanUser.innerText = userDataComplete.dono && userDataComplete.restaurante 
            ? userDataComplete.restaurante 
            : userDataComplete.name;
        }
        
        if (spanTipo) {
          spanTipo.innerText = userDataComplete.dono 
            ? "Dono de Restaurante" 
            : "Cliente";
        }

        if (spanTel) {
          spanTel.innerText = userDataComplete.telefone 
            ? `📞 ${userDataComplete.telefone}` 
            : "📞 --";
        }

        if (spanLoc) {
          const cidade = userDataComplete.cidadeNome || "---";
          const estado = userDataComplete.estadoNome || "Brasil";
          spanLoc.innerText = `📍 ${cidade} / ${estado}`;
        }

        if (spanHorarios) {
          spanHorarios.innerText = userDataComplete.horarios 
            ? `⏰ ${userDataComplete.horarios}` 
            : "⏰ --";
        }

        const profileImg = document.getElementById("profile-img");
        if (profileImg && userDataComplete.foto) {
          profileImg.src = userDataComplete.foto;
        }
      }
    } catch (error) {
      console.error("Erro ao carregar dados completos:", error);
    }
  }
};
</script>

</body>
</html>
