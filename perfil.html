<script>


lucide.createIcons();


  fetch('footer.html')

      document.getElementById('footer-container').innerHTML = data;
    });

  window.webservice = window.webservice || "https://imenu-backend-pd3a.onrender.com";

  function parseJwt(token) {
    try {
      return JSON.parse(atob(token.split('.')[1]));
    } catch (e) {
      return null;
    }
  }

  async function carregarRelatorioVisualizacoes() {
    const token = localStorage.getItem("auth_token");
    if (!token) return;

    const userData = parseJwt(token);
    if (!userData?.dono) return;

    try {
      const webservice = "https://imenu-backend-pd3a.onrender.com";

      const res = await fetch(`${webservice}/relatorio/views`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) throw new Error(`Erro: ${res.status}`);
      const posts = await res.json();
      const tbody = document.querySelector("#tabela-relatorio tbody");
      tbody.innerHTML = "";

      if (posts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">Nenhum cardápio publicado ainda</td></tr>`;
        return;
      }

      posts.forEach(post => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${post.id}</td>
          <td>${post.title || 'Sem título'}</td>
          <td>${post.views || 0}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("relatorio").style.display = "block";
    } catch (err) {
      console.error("Erro ao carregar relatório:", err);
    }
  }

  async function gerarRelatorioPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Relatório de Visualizações", 14, 20);
    const headers = [["ID", "Título", "Visualizações"]];
    const body = [];
    document.querySelectorAll("#tabela-relatorio tbody tr").forEach(row => {
      const cols = Array.from(row.querySelectorAll("td")).map(td => td.textContent);
      body.push(cols);
    });
    doc.autoTable({ head: headers, body: body, startY: 30 });
    doc.save("relatorio-visualizacoes.pdf");
  }
 

  window.onload = async () => {

  await carregarFotoPerfil();

  // Mostrar/esconder ícone de editar

    if (editIcon) editIcon.style.display = "flex";
  } else {

    logoutBtn.style.display = (!perfilSendoVisualizadoId || perfilSendoVisualizadoId === usuarioLogadoId)

      : "none";

  const configBtn = document.getElementById("config-btn");
  if (configBtn) {
    configBtn.style.display = (!perfilSendoVisualizadoId || perfilSendoVisualizadoId === usuarioLogadoId)
      ? "inline-block"
      : "none";
  }
};



// Função para converter File para Base64 (sem o prefixo data:)
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            // Remove o prefixo data:image/...;base64,
            const base64String = reader.result.split(',')[1];
            resolve(base64String);
        };
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
    });
}

async function editarFotoPerfil() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    
    input.onchange = async (event) => {
        const file = event.target.files[0];
        if (!file || file.size > 5 * 1024 * 1024) {
            alert('Por favor, selecione uma imagem menor que 5MB');
            return;
        }

        const profileImg = document.getElementById('profile-img');
        const originalSrc = profileImg.src;

                // Criar e mostrar spinner
        const spinner = document.createElement('div');
        spinner.className = 'loading-spinner';
        profileImg.parentNode.appendChild(spinner);
        
        try {
            // Mostrar preview
            profileImg.src = URL.createObjectURL(file);

            // 1. Fazer upload da imagem
            const formData = new FormData();
            formData.append('file', file);
            
            const uploadResponse = await fetch(`${webservicef}/api/upload`, {
                method: 'POST',
                body: formData
                // Não definir Content-Type manualmente
            });

            if (!uploadResponse.ok) {
                throw new Error("Falha no upload da imagem");
            }

            const uploadData = await uploadResponse.json();
            if (!uploadData.success || !uploadData.fileUrl) {
                throw new Error("URL da imagem não recebida");
            }

            // 2. Atualizar no banco de dados
            const token = localStorage.getItem("auth_token");
            if (!token) throw new Error("Sessão expirada");

            const updateResponse = await fetch(`${webservice}/user/photo`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ foto: uploadData.fileUrl })
            });

            if (!updateResponse.ok) {
                const errorData = await updateResponse.json();
                throw new Error(errorData.error || "Falha ao atualizar perfil");
            }

            alert('Foto atualizada com sucesso!');
            
        } catch (error) {
            console.error('Erro ao atualizar foto:', error);
            profileImg.src = originalSrc;
            alert(`Erro: ${error.message}`);
        }
              finally {
            // Remover spinner
            if (spinner) spinner.remove();
        }
    };
    
    input.click();
}
// Inicialização
document.getElementById('profile-img').addEventListener('click', editarFotoPerfil);

// Adicionar evento de clique à foto de perfil
document.getElementById('profile-img').addEventListener('click', editarFotoPerfil);

// Carregar a foto do usuário ao abrir a página
async function carregarFotoPerfil() {
    const userIdParam = new URLSearchParams(window.location.search).get('userId');
    if (userIdParam) return; // Não carrega se estiver vendo outro perfil

    try {
      const webservice = "https://imenu-backend-pd3a.onrender.com";

        const token = localStorage.getItem("auth_token");
        if (!token) return;
        
        const profileImg = document.getElementById('profile-img');
        // Armazenar a imagem original
        profileImg.dataset.originalSrc = profileImg.src;
        
        const response = await fetch(`${webservice}/dados`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            const userData = await response.json();
            if (userData.foto) {
                profileImg.src = userData.foto;
                // Atualizar a imagem original
                profileImg.dataset.originalSrc = userData.foto;
            }
        }
    } catch (error) {
        console.error('Erro ao carregar foto:', error);
    }
}

function getIdFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("userId"); // <- CORRETO

  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    
    if (userId) {
        carregarPerfilRestaurante(userId);
    } else {
        // Comportamento normal para o perfil do usuário logado
        verificarToken();
    }
});

async function carregarPerfilRestaurante(userId) {
    try {
        const token = localStorage.getItem('auth_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        
        const response = await fetch(`https://imenu-backend-pd3a.onrender.com/user/${userId}`, {
            headers: headers
        });

        if (!response.ok) {
            throw new Error('Erro ao carregar perfil');
        }

        const userData = await response.json();
        
        // Atualizar a UI com os dados do restaurante
        document.getElementById('P-username').textContent = userData.name;
        if (userData.foto) {
            document.getElementById('profile-img').src = userData.foto;
        }
        
        // Carregar cardápios públicos do restaurante
        const postsResponse = await fetch(`https://imenu-backend-pd3a.onrender.com/user/${userId}/posts`, {
            headers: headers
        });
        
        const posts = await postsResponse.json();
        atualizarPostsUI(posts, "cards_user");
        
    } catch (error) {
        console.error('Erro ao carregar perfil do restaurante:', error);
        alert('Não foi possível carregar o perfil deste restaurante.');
    }
}
