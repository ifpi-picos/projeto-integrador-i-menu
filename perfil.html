<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil</title>
  <link rel="stylesheet" href="perfil.css"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- PDF libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bodyp">

<!-- Cabeçalho -->
<header class="headerperfil d-flex align-items-center justify-content-between px-3">
  <div class="d-flex align-items-center">
    <button class="icon-button me-2" onclick="voltar()" aria-label="Voltar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="icon-button" id="locationicon" onclick="localizacao()">📍</button>
  </div>

  <!-- Botão de Logout no canto direito com Bootstrap -->
  <button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()" title="Sair">Sair</button>
</header>

<!-- Banner -->
<div class="banner-perfil">
  <img src="images/background-cad.png" alt="Banner do restaurante" />
</div>

<!-- Perfil -->
<section class="main-p">
  <div class="profile-card">
    <div class="image">
      <img src="images/perfil.png" alt="Foto de perfil" class="profile-pic" id="profile-img"/>
    </div>

    <div class="data">
      <h2 class="h2P" id="P-username">None</h2>
      <div class="stars" id="stars">★★★★☆</div>
      <p id="tipo-conta">none</p>
    </div>

    <div class="rowP">
      <div class="info">
        <h3 id="localizacao">📍 --- / Brasil</h3>
      </div>
      <div class="info">
        <h3>Seguidores</h3>
        <span>--</span>
      </div>
      <div class="info">
        <h3>Visitados</h3>
        <span>--</span>
      </div>
    </div>
  </div>
</section>

<!-- Cardápios publicados -->
<section class="section">
  <h4>Cardápios publicados</h4>
  <div id="cards_user">
    <div id="cards_user_info">
      <div class="image-item" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background-color: #e0e0e0;">+</div>
    </div>
  </div>
</section>

<!-- Cardápios privados -->
<section class="section">
  <h4>Cardápios privados</h4>
  <div id="cards_user_p">
    <div id="cards_user_info_p">
      <div class="image-item" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background-color: #e0e0e0;">+</div>
    </div>
  </div>
</section>

<!-- Relatório de Visualizações (apenas para donos) -->
<section class="section" id="relatorio" style="display: none; margin-top: 30px;">
  <h4>📊 Relatório de Visualizações</h4>
  <button onclick="gerarRelatorioPDF()" class="btn btn-primary">📄 Baixar PDF</button>
  <table id="tabela-relatorio" class="table table-bordered mt-2">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Visualizações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<!-- Comentários -->
<section class="section">
  <h4>Comentários (78) <span class="rating-small">★★★☆☆</span></h4>
</section>

<div id="footer-container"></div>

<!-- Scripts -->
<script src="js/server_script.js"></script>
<script src="js/script.js"></script>

<script>

  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-container').innerHTML = data;
    });

  window.webservice = window.webservice || "https://imenu-backend-pd3a.onrender.com";

  function parseJwt(token) {
    try {
      return JSON.parse(atob(token.split('.')[1]));
    } catch (e) {
      return null;
    }
  }

  async function carregarRelatorioVisualizacoes() {
    const token = localStorage.getItem("auth_token");
    if (!token) return;

    const userData = parseJwt(token);
    if (!userData?.dono) return;

    try {
      const webservice = "https://imenu-backend-pd3a.onrender.com";

      const res = await fetch(`${webservice}/relatorio/views`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) throw new Error(`Erro: ${res.status}`);
      const posts = await res.json();
      const tbody = document.querySelector("#tabela-relatorio tbody");
      tbody.innerHTML = "";

      if (posts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">Nenhum cardápio publicado ainda</td></tr>`;
        return;
      }

      posts.forEach(post => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${post.id}</td>
          <td>${post.title || 'Sem título'}</td>
          <td>${post.views || 0}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("relatorio").style.display = "block";
    } catch (err) {
      console.error("Erro ao carregar relatório:", err);
    }
  }

  async function gerarRelatorioPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Relatório de Visualizações", 14, 20);
    const headers = [["ID", "Título", "Visualizações"]];
    const body = [];
    document.querySelectorAll("#tabela-relatorio tbody tr").forEach(row => {
      const cols = Array.from(row.querySelectorAll("td")).map(td => td.textContent);
      body.push(cols);
    });
    doc.autoTable({ head: headers, body: body, startY: 30 });
    doc.save("relatorio-visualizacoes.pdf");
  }

  function fazerLogout() {
    localStorage.removeItem("auth_token");
    window.location.href = "login.html"; // redireciona para login
  }

  window.onload = async () => {
    await verificarToken()
    await carregarRelatorioVisualizacoes();
  };


// Função para converter File para Base64 (sem o prefixo data:)
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            // Remove o prefixo data:image/...;base64,
            const base64String = reader.result.split(',')[1];
            resolve(base64String);
        };
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
    });
}

async function uploadProfilePicture(file) {
    try {
        const fileService = "https://imenu-back-files.onrender.com"; // Servidor de arquivos

        // Validar o tipo de arquivo
        if (!file.type.match('image.*')) {
            throw new Error('Por favor, selecione uma imagem (JPEG, PNG)');
        }

        // Converter para base64
        const base64Image = await fileToBase64(file);

        // Mostrar estado de carregamento
        const profileImg = document.getElementById('profile-img');
        profileImg.classList.add('uploading');

        // Enviar para o servidor de arquivos
        const response = await fetch(`${fileService}/upload-profile-pic`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                file: base64Image
            })
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || 'Erro no servidor');
        }

        return await response.json();
    } catch (error) {
        console.error('Erro no upload:', error);
        throw error;
    } finally {
        document.getElementById('profile-img').classList.remove('uploading');
    }
}

async function editarFotoPerfil() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    
    input.onchange = async (event) => {
        const webservice = "https://imenu-backend-pd3a.onrender.com";
        const fileService = "https://imenu-back-files.onrender.com";

        const file = event.target.files[0];
        if (!file || file.size > 5 * 1024 * 1024) {
            alert('Por favor, selecione uma imagem menor que 5MB');
            return;
        }

        const profileImg = document.getElementById('profile-img');
        const originalSrc = profileImg.src;
        
        try {
            // Mostrar preview
            profileImg.src = URL.createObjectURL(file);

            // Fazer upload
            const { url } = await uploadProfilePicture(file);

            // Atualizar no banco de dados
            const token = localStorage.getItem("auth_token");
            if (!token) throw new Error("Sessão expirada");

            const updateResponse = await fetch(`${webservice}/user/photo`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ foto: url })
            });

            if (!updateResponse.ok) {
                throw new Error("Falha ao salvar no perfil");
            }

            // Forçar recarregamento da foto
            await carregarFotoPerfil();
            
            alert('Foto atualizada com sucesso!');
        } catch (error) {
            console.error('Erro ao atualizar foto:', error);
            profileImg.src = originalSrc;
            alert(`Erro: ${error.message}`);
        }
    };
    
    input.click();
}

// Inicialização
document.getElementById('profile-img').addEventListener('click', editarFotoPerfil);

// Adicionar evento de clique à foto de perfil
document.getElementById('profile-img').addEventListener('click', editarFotoPerfil);

// Carregar a foto do usuário ao abrir a página
async function carregarFotoPerfil() {
    try {
      const webservice = "https://imenu-backend-pd3a.onrender.com";

        const token = localStorage.getItem("auth_token");
        if (!token) return;
        
        const profileImg = document.getElementById('profile-img');
        // Armazenar a imagem original
        profileImg.dataset.originalSrc = profileImg.src;
        
        const response = await fetch(`${webservice}/dados`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            const userData = await response.json();
            if (userData.foto) {
                profileImg.src = userData.foto;
                // Atualizar a imagem original
                profileImg.dataset.originalSrc = userData.foto;
            }
        }
    } catch (error) {
        console.error('Erro ao carregar foto:', error);
    }
}
// Chamar a função quando a página carregar
window.addEventListener('load', carregarFotoPerfil);
  

</script>

</body>
</html>
