<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Pesquisa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="pesquisa.css" />
    <script src="js/pesquisa.js" defer></script>
  </head>
  <body>

    <div id="header-container"></div>

    <div class="container">
      <!-- Botões de filtro e barra de busca -->
      <div class="row mt-2" id="filter-buttons">
        <div class="col-12 d-flex flex-wrap align-items-center gap-2">
          <button class="btn active" data-filter="all">Todos</button>
          <button class="btn" data-filter="bebidas">Bebidas</button>
          <button class="btn" data-filter="refeicoes">Refeições</button>
          <button class="btn" data-filter="sobremesas">Sobremesas</button>
          <button class="btn" data-filter="lanches">Lanches</button>
          <button class="btn" data-filter="sushi">Sushi</button>
          <button class="btn" data-filter="vegetariano">Vegetariano</button>
          <input id="barP" type="text" placeholder="Buscar..." />
        </div>
      </div>

      <!-- MENSAGEM DE VAZIO / CARREGANDO -->
      <p id="mensagem-vazia" class="text-center text-muted mt-4">Carregando cardápios...</p>

      <!-- CARDS -->
      <div class="row px-2 mt-4 gap-3 justify-content-start" id="filterable-cards">
        <!-- Conteúdo será gerado dinamicamente -->
      </div>
    </div>

    <div id="footer-container"></div>

    <script src="js/script.js"></script>
    <script src="js/cabecalho.js"></script>
    <script src="js/server_script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      lucide.createIcons();

      fetch('cabecalho.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-container').innerHTML = data;
          if (typeof initCabecalho === 'function') initCabecalho();
        });

      fetch('footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        });

      async function carregarRestaurantesPopularesP() {
        try {
          const response = await fetch(`${webservice}/card/populares`);
          if (!response.ok) throw new Error('Erro ao carregar restaurantes populares');
          const restaurantes = await response.json();
          return restaurantes;
        } catch (err) {
          console.error('Erro ao carregar restaurantes populares:', err);
          return [];
        }
      }

      async function carregarCardapios() {
        const msg = document.getElementById('mensagem-vazia');
        const container = document.getElementById('filterable-cards');
        msg.textContent = 'Carregando cardápios...';
        container.innerHTML = '';

        try {
          const response = await fetch(`${webservice}/recentP?include=tags`);
          if (!response.ok) throw new Error('Erro ao carregar cardápios');

          const cardapios = await response.json();
          msg.textContent = '';
          exibirCardapios(cardapios);
        } catch (err) {
          console.error('Erro:', err);
          msg.textContent = 'Erro ao carregar cardápios. Tente novamente mais tarde.';
        }
      }

      function exibirCardapios(cardapios) {
        const container = document.getElementById('filterable-cards');
        container.innerHTML = '';

        if (!cardapios || cardapios.length === 0) {
          document.getElementById('mensagem-vazia').textContent = 'Nenhum cardápio encontrado.';
          return;
        }

        cardapios.forEach(cardapio => {
          const tags = (cardapio.tags || []).map(t => t.name).join(' ');
          const card = document.createElement('div');
          card.className = 'card p-0 card-wrapper';
          card.dataset.name = tags || 'sem-tags';
          card.onclick = () => abrirPost(cardapio.id);

          card.innerHTML = `
            <img src="${cardapio.capa || 'images/default-cardapio.jpg'}" alt="${cardapio.title}" />
            <div class="card-body">
              <h6 class="card-title">${cardapio.title}</h6>
              <div class="card-rating">
                ${cardapio.avgRating ? `⭐ ${cardapio.avgRating}` : 'Sem avaliações'}
              </div>
              ${cardapio.tags && cardapio.tags.length > 0 ? `
              <div class="card-tags">
                ${cardapio.tags.map(t => `<span class="tag">${t.name}</span>`).join('')}
              </div>` : ''}
            </div>
          `;

          container.appendChild(card);
        });
      }

      function filtrarCardapios(filter, searchTerm) {
        const cards = document.querySelectorAll('.card-wrapper');
        const searchLower = searchTerm.toLowerCase();
        let visiveis = 0;

        cards.forEach(card => {
          const cardTags = card.dataset.name || '';
          const title = card.querySelector('.card-title').textContent.toLowerCase();
          const matchesFilter = filter === 'all' || cardTags.includes(filter);
          const matchesSearch = title.includes(searchLower) || cardTags.includes(searchLower);
          const mostrar = matchesFilter && matchesSearch;
          card.style.display = mostrar ? 'block' : 'none';
          if (mostrar) visiveis++;
        });

        const msg = document.getElementById("mensagem-vazia");
        if (visiveis === 0) {
          let filtroTexto = filter === 'all' ? 'todos os itens' : filter;
          filtroTexto = filtroTexto.charAt(0).toUpperCase() + filtroTexto.slice(1);

          if (searchTerm.trim()) {
            msg.textContent = `Nenhum cardápio encontrado em "${filtroTexto}" com a busca "${searchTerm}".`;
          } else {
            msg.textContent = `Nenhum cardápio encontrado em "${filtroTexto}".`;
          }
        } else {
          msg.textContent = '';
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        await verificarToken();
        await carregarCardapios();

        const urlParams = new URLSearchParams(window.location.search);
        const filterParam = urlParams.get('filter');

        if (filterParam) {
          const filterButton = document.querySelector(`.btn[data-filter="${filterParam}"]`);
          if (filterButton) {
            filterButton.classList.add('active');
            filtrarCardapios(filterParam, '');
          } else {
            document.querySelector('.btn[data-filter="all"]').classList.add('active');
          }
        } else {
          document.querySelector('.btn[data-filter="all"]').classList.add('active');
        }

        const filterButtons = document.querySelectorAll("#filter-buttons .btn");
        const searchInput = document.getElementById("barP");

        if (filterButtons.length > 0 && searchInput) {
          filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {
              filterButtons.forEach(button => button.classList.remove("active"));
              btn.classList.add("active");
              filtrarCardapios(btn.dataset.filter, searchInput.value);
            });
          });

          searchInput.addEventListener("input", () => {
            const activeFilter = document.querySelector("#filter-buttons .btn.active");
            if (activeFilter) {
              filtrarCardapios(activeFilter.dataset.filter, searchInput.value);
            }
          });
        }
      });
    </script>

  </body>
</html>
